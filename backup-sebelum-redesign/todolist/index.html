              <span style="font-weight:600;font-size:.9rem">${esc(s.name)}</span>
              ${s.kelompok?`<span style="font-size:.72rem;color:var(--dim)">${esc(s.kelompok)}</span>`:''}
              <span style="font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:${cfg.bg};color:${cfg.color}">${cfg.label}</span>
            </div>
            ${s.alasan?`<div style="font-size:.82rem;color:var(--dim);margin-top:3px;line-height:1.5">${esc(s.alasan)}</div>`:''}
            ${dateStr?`<div style="font-size:.72rem;color:var(--dim);margin-top:2px">${dateStr}</div>`:''}
          </div>
          ${actsHtml}
        `;
        row.querySelector('[data-sk-edit]')?.addEventListener('click',()=>openModal('sanksi-edit',{id:s.id}));
        row.querySelector('[data-sk-del]')?.addEventListener('click',()=>{
          if(!confirm(`Hapus sanksi "${s.name}"?`)) return;
          const t=db.regulasi.sanksi.find(x=>x.id===s.id);
          if(t) touch(Object.assign(t,{deleted:true}));
          save(); renderKomunitas();
        });
        card.appendChild(row);
      });
    }
  }
}

/* ══════════════════════════════════════════
   NOTULENSI VIEW
══════════════════════════════════════════ */
function renderNotulensi(){
  const area=document.getElementById('notulensiArea');
  area.innerHTML='';
  const isAdmin=role==='admin';
  const MONTH=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

  function fmtDate(d){
    if(!d) return null;
    const [y,m,dd]=d.split('-');
    return `${parseInt(dd)} ${MONTH[parseInt(m)-1]} ${y}`;
  }
  function fmtDateTime(s){ const d=fmtDate(s.date); return d?(s.time?`${d} · ${s.time}`:d):'Tanpa tanggal'; }

  /* Toolbar */
  const toolbar=document.createElement('div');
  toolbar.className='notul-toolbar';
  toolbar.innerHTML=`
    <span class="notul-toolbar-title">📝 Notulensi</span>
    <input class="asset-search" id="notulSearchInp" placeholder="Cari topik…" value="${esc(notulSearch)}" style="max-width:200px"/>
  `;
  if(isAdmin){
    const btn=document.createElement('button');
    btn.className='task-add-inline-btn';
    btn.textContent='＋ Topik Baru';
    btn.addEventListener('click',()=>openModal('notul-topik-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  area.querySelector('#notulSearchInp').addEventListener('input',e=>{
    notulSearch=e.target.value; renderNotulensi();
  });

  const q=notulSearch.trim().toLowerCase();
  const topiks=(db.notulensiTopik||[]).filter(t=>!t.deleted&&(!q||t.title.toLowerCase().includes(q)));
  const allSesi=(db.notulensi||[]).filter(s=>!s.deleted);

  /* Sort topiks: by latest sesi date desc, fallback createdAt desc */
  const latestSesiDate=tid=>{
    const dates=allSesi.filter(s=>s.topikId===tid&&s.date).map(s=>s.date);
    return dates.length?Math.max(...dates.map(d=>d)):null;
  };
  const sorted=[...topiks].sort((a,b)=>{
    const la=latestSesiDate(a.id)||'0000-00-00';
    const lb=latestSesiDate(b.id)||'0000-00-00';
    return la<lb?1:la>lb?-1:(b.createdAt||0)-(a.createdAt||0);
  });

  /* Orphan sesi (no topikId — backward compat with v1 data) */
  const orphans=allSesi.filter(s=>!s.topikId)
    .sort((a,b)=>(b.date||'')>(a.date||'')?1:-1);

  if(!sorted.length&&!orphans.length){
    const e=document.createElement('div');
    e.className='asset-empty';
    e.textContent='Belum ada topik. Klik "+ Topik Baru" untuk mulai mencatat rapat.';
    area.appendChild(e); return;
  }

  /* Render each topik */
  sorted.forEach(t=>{
    const sesiList=allSesi.filter(s=>s.topikId===t.id)
      .sort((a,b)=>(b.date||'')>=(a.date||'')?1:(a.date||'')>(b.date||'')?-1:(b.createdAt||0)-(a.createdAt||0));

    const topikEl=document.createElement('div');
    topikEl.className='notul-topik';

    const sesiCountLabel=sesiList.length?`${sesiList.length} rapat`:'Belum ada rapat';
    const lastDate=sesiList[0]?.date?fmtDate(sesiList[0].date):'';
    const locked=t.kode&&!isTopikUnlocked(t);

    topikEl.innerHTML=`
      <div class="notul-topik-head">
        <div class="notul-topik-icon">${locked?'🔒':'📋'}</div>
        <div class="notul-topik-info">
          <div class="notul-topik-title">${esc(t.title)}</div>
          <div class="notul-topik-meta">${sesiCountLabel}${lastDate?' · '+lastDate:''}${locked?' · <span style="color:var(--gold)">Kode diperlukan</span>':''}</div>
        </div>
        ${isAdmin?`<div class="notul-topik-acts">
          <button class="asset-act-btn" data-tk-edit="${t.id}" title="Edit topik">✎</button>
          <button class="asset-act-btn del" data-tk-del="${t.id}" title="Hapus topik">✕</button>
        </div>`:''}
        <span class="notul-chevron">${locked&&!isAdmin?'🔑':'▼'}</span>
      </div>
      <div class="notul-topik-body">
        ${t.desc?`<div class="notul-topik-desc">${esc(t.desc)}</div>`:''}
        ${locked&&!isAdmin
          ? `<div style="padding:14px;text-align:center;color:var(--muted);font-size:.78rem">Masukkan kode untuk melihat catatan rapat.</div>`
          : `<div class="notul-sesi-list" id="sesi-list-${t.id}"></div>
             ${isAdmin?`<button class="notul-topik-add-btn" data-add-sesi="${t.id}">＋ Tambah Rapat</button>`:''}`
        }
      </div>
    `;

    /* Toggle open — if locked & viewer: open unlock modal */
    topikEl.querySelector('.notul-topik-head').addEventListener('click',e=>{
      if(e.target.closest('.notul-topik-acts')) return;
      if(locked&&!isAdmin){ openModal('notul-unlock',{id:t.id}); return; }
      topikEl.classList.toggle('open');
    });

    /* Edit topik */
    topikEl.querySelector('[data-tk-edit]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('notul-topik-edit',{id:t.id});
    });

    /* Delete topik (cascade sesi) */
    topikEl.querySelector('[data-tk-del]')?.addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm(`Hapus topik "${t.title}" beserta ${sesiList.length} rapat di dalamnya?`)) return;
      touch(Object.assign(t,{deleted:true}));
      sesiList.forEach(s=>touch(Object.assign(s,{deleted:true})));
      save(); renderNotulensi();
    });

    /* Add sesi */
    topikEl.querySelector('[data-add-sesi]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('notul-sesi-add',{topikId:t.id});
    });

    /* Render sesi rows — sesiContainer is null when locked for viewer */
    const sesiContainer=topikEl.querySelector(`#sesi-list-${t.id}`);
    if(!sesiContainer){ area.appendChild(topikEl); return; }
    sesiList.forEach(s=>{
      const sesiEl=document.createElement('div');
      sesiEl.className='notul-sesi';
      sesiEl.innerHTML=`
        <div class="notul-sesi-head">
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="notul-date-badge">${fmtDateTime(s)}</span>
              ${s.location?`<span class="notul-sesi-loc">📍 ${esc(s.location)}</span>`:''}
            </div>
            ${(s.agenda||s.attendees)?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              ${s.agenda?`<span style="font-size:.7rem;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:320px">📋 ${esc(s.agenda)}</span>`:''}
              ${s.attendees?`<span style="font-size:.64rem;color:var(--muted);white-space:nowrap">👥 ${esc(s.attendees)}</span>`:''}
            </div>`:''}
          </div>
          ${isAdmin?`<div class="notul-sesi-acts">
            <button class="asset-act-btn" data-sesi-edit="${s.id}" title="Edit rapat">✎</button>
            <button class="asset-act-btn del" data-sesi-del="${s.id}" title="Hapus rapat">✕</button>
          </div>`:''}
          <span class="notul-sesi-chevron">▼</span>
        </div>
        <div class="notul-sesi-body">
          ${s.agenda?`<div class="notul-section"><div class="notul-section-label">Agenda</div><div class="notul-section-text">${esc(s.agenda)}</div></div>`:''}
          ${s.notes?`<div class="notul-section"><div class="notul-section-label">Catatan</div><div class="notul-section-text">${esc(s.notes)}</div></div>`:''}
          ${s.decisions?`<div class="notul-section"><div class="notul-section-label">Keputusan / Tindak Lanjut</div><div class="notul-section-text">${esc(s.decisions)}</div></div>`:''}
        </div>
      `;
      sesiEl.querySelector('.notul-sesi-head').addEventListener('click',()=>sesiEl.classList.toggle('open'));
      sesiEl.querySelector('[data-sesi-edit]')?.addEventListener('click',e2=>{
        e2.stopPropagation();
        openModal('notul-sesi-edit',{id:s.id,topikId:t.id});
      });
      sesiEl.querySelector('[data-sesi-del]')?.addEventListener('click',e2=>{
        e2.stopPropagation();
        if(!confirm('Hapus rapat ini?')) return;
        touch(Object.assign(s,{deleted:true})); save(); renderNotulensi();
      });
      sesiContainer.appendChild(sesiEl);
    });

    area.appendChild(topikEl);
  });

  /* Orphan sesi (v1 data without topikId) */
  if(orphans.length){
    const orpBox=document.createElement('div');
    orpBox.style.cssText='margin-top:8px;border-top:1px solid var(--bd);padding-top:8px';
    orpBox.innerHTML=`<div style="font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:8px">Rapat Lama (tanpa topik)</div>`;
    orphans.forEach(n=>{
      const c=document.createElement('div');
      c.className='notul-topik';
      c.innerHTML=`
        <div class="notul-topik-head">
          <div class="notul-topik-icon">📝</div>
          <div class="notul-topik-info">
            <div class="notul-topik-title">${esc(n.title)}</div>
            <div class="notul-topik-meta">${fmtDateTime(n)}</div>
          </div>
          ${isAdmin?`<div class="notul-topik-acts">
            <button class="asset-act-btn" data-orphan-edit="${n.id}" title="Edit">✎</button>
            <button class="asset-act-btn del" data-orphan-del="${n.id}" title="Hapus">✕</button>
          </div>`:''}
          <span class="notul-chevron">▼</span>
        </div>
        <div class="notul-topik-body">
          <div class="notul-sesi-body" style="display:block;padding:8px 14px 12px;background:var(--surface)">
            ${n.attendees?`<div class="notul-sesi-meta"><span>👥 ${esc(n.attendees)}</span>${n.location?`<span>📍 ${esc(n.location)}</span>`:''}</div>`:''}
            ${n.agenda?`<div class="notul-section"><div class="notul-section-label">Agenda</div><div class="notul-section-text">${esc(n.agenda)}</div></div>`:''}
            ${n.notes?`<div class="notul-section"><div class="notul-section-label">Catatan</div><div class="notul-section-text">${esc(n.notes)}</div></div>`:''}
            ${n.decisions?`<div class="notul-section"><div class="notul-section-label">Keputusan</div><div class="notul-section-text">${esc(n.decisions)}</div></div>`:''}
          </div>
        </div>
      `;
      c.querySelector('.notul-topik-head').addEventListener('click',e=>{
        if(e.target.closest('.notul-topik-acts')) return;
        c.classList.toggle('open');
      });
      c.querySelector('[data-orphan-edit]')?.addEventListener('click',e=>{
        e.stopPropagation();
        openModal('notul-sesi-edit',{id:n.id,topikId:null});
      });
      c.querySelector('[data-orphan-del]')?.addEventListener('click',e=>{
        e.stopPropagation();
        if(!confirm(`Hapus "${n.title}"?`)) return;
        touch(Object.assign(n,{deleted:true})); save(); renderNotulensi();
      });
      orpBox.appendChild(c);
    });
    area.appendChild(orpBox);
  }
}

/* ══════════════════════════════════════════
   BROADCAST MARKETING VIEW
══════════════════════════════════════════ */
function renderBroadcast(){
  const area=document.getElementById('broadcastArea');
  area.innerHTML='';
  const isAdmin=role==='admin';

  /* Toolbar */
  const toolbar=document.createElement('div');
  toolbar.className='notul-toolbar';
  toolbar.innerHTML=`
    <span class="notul-toolbar-title">📣 Broadcast Marketing</span>
    <input class="asset-search" id="bcSearchInp" placeholder="Cari produk…" value="${esc(broadcastSearch)}" style="max-width:200px"/>
  `;
  if(isAdmin){
    const btn=document.createElement('button');
    btn.className='task-add-inline-btn';
    btn.textContent='＋ Produk Baru';
    btn.addEventListener('click',()=>openModal('bc-produk-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  area.querySelector('#bcSearchInp').addEventListener('input',e=>{ broadcastSearch=e.target.value; renderBroadcast(); });

  const q=broadcastSearch.trim().toLowerCase();
  const produkList=(db.broadcastProduk||[]).filter(p=>!p.deleted&&(!q||p.nama.toLowerCase().includes(q)))
    .slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  if(!produkList.length){
    const e=document.createElement('div');
    e.className='asset-empty';
    e.textContent='Belum ada produk. Klik "+ Produk Baru" untuk mulai.';
    area.appendChild(e); return;
  }

  /* Viewer gate — global broadcastKode */
  if(!isAdmin&&!isBroadcastUnlocked()){
    const gate=document.createElement('div');
    gate.className='notul-topik';
    gate.style.cssText='padding:20px;text-align:center';
    gate.innerHTML=`
      <div style="font-size:.85rem;font-weight:700;margin-bottom:4px">🔒 Akses Broadcast</div>
      <div style="font-size:.72rem;color:var(--dim);margin-bottom:14px">Masukkan kode untuk melihat kondisi &amp; broadcast produk</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:280px;margin:0 auto">
        <div style="position:relative">
          <input class="form-input" id="bcGateCode" type="password" placeholder="Kode akses" maxlength="60"
            style="padding-right:36px;width:100%;box-sizing:border-box;font-family:var(--mono)"/>
          <button id="bcGateEye" tabindex="-1"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.8rem;padding:2px">👁</button>
        </div>
        <button id="bcGateBtn" style="padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:.82rem;font-weight:700">Masuk</button>
        <div id="bcGateErr" style="font-size:.72rem;color:var(--red,#f87171);min-height:14px"></div>
      </div>
    `;
    area.appendChild(gate);
    const codeInp=gate.querySelector('#bcGateCode');
    const eyeBtn=gate.querySelector('#bcGateEye');
    const btn=gate.querySelector('#bcGateBtn');
    const errEl=gate.querySelector('#bcGateErr');
    eyeBtn.addEventListener('click',()=>{ codeInp.type=codeInp.type==='password'?'text':'password'; });
    function tryBcGate(){
      const code=codeInp.value.trim();
      if(!code){ errEl.textContent='Isi kode.'; return; }
      if(code!==db.settings.broadcastKode){
        errEl.textContent='Kode tidak sesuai.';
        codeInp.classList.add('error');
        setTimeout(()=>{codeInp.classList.remove('error');errEl.textContent=''},1800); return;
      }
      bcSession=true;
      try{sessionStorage.setItem('alteco_bc_session','1');}catch{}
      renderBroadcast();
    }
    btn.addEventListener('click',tryBcGate);
    codeInp.addEventListener('keydown',e=>{if(e.key==='Enter')tryBcGate();});
    codeInp.focus();
    return;
  }

  /* Session badge + keluar btn for viewer */
  if(!isAdmin&&bcSession){
    const badge=document.createElement('span');
    badge.style.cssText='display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--dim);margin-bottom:4px';
    const outBtn=document.createElement('button');
    outBtn.textContent='Keluar';
    outBtn.style.cssText='font-size:.68rem;padding:3px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);cursor:pointer';
    outBtn.addEventListener('click',()=>{
      bcSession=false;
      try{sessionStorage.removeItem('alteco_bc_session');}catch{}
      renderBroadcast();
    });
    badge.appendChild(outBtn);
    toolbar.appendChild(badge);
  }

  produkList.forEach(p=>{
    const kondisiList=(p.kondisi||[]).filter(k=>!k.deleted);

    const produkEl=document.createElement('div');
    produkEl.className='notul-topik';

    const metaKondisi=kondisiList.length?`${kondisiList.length} kondisi`:'Belum ada kondisi';
    produkEl.innerHTML=`
      <div class="notul-topik-head">
        <div class="notul-topik-icon">📣</div>
        <div class="notul-topik-info">
          <div class="notul-topik-title">${esc(p.nama)}</div>
          <div class="notul-topik-meta">${metaKondisi}${p.urlPitchDeck?` · <a href="${esc(p.urlPitchDeck)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none" onclick="event.stopPropagation()">📄 Pitch Deck</a>`:''}</div>
        </div>
        ${isAdmin?`<div class="notul-topik-acts">
          <button class="asset-act-btn" data-bc-edit="${p.id}" title="Edit produk">✎</button>
          <button class="asset-act-btn del" data-bc-del="${p.id}" title="Hapus produk">✕</button>
        </div>`:''}
        <span class="notul-chevron">▼</span>
      </div>
      <div class="notul-topik-body">
        <div id="bc-kondisi-list-${p.id}"></div>
        ${isAdmin?`<button class="notul-topik-add-btn" data-add-kondisi="${p.id}">＋ Tambah Kondisi</button>`:''}
      </div>
    `;

    /* Toggle open */
    produkEl.querySelector('.notul-topik-head').addEventListener('click',e=>{
      if(e.target.closest('.notul-topik-acts')) return;
      produkEl.classList.toggle('open');
    });

    /* Edit produk */
    produkEl.querySelector('[data-bc-edit]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('bc-produk-edit',{id:p.id});
    });

    /* Delete produk (cascade) */
    produkEl.querySelector('[data-bc-del]')?.addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm(`Hapus produk "${p.nama}" beserta semua kondisi dan broadcast di dalamnya?`)) return;
      (p.kondisi||[]).forEach(k=>{
        (k.items||[]).forEach(it=>touch(Object.assign(it,{deleted:true})));
        touch(Object.assign(k,{deleted:true}));
      });
      touch(Object.assign(p,{deleted:true}));
      save(); renderBroadcast();
    });

    /* Add kondisi */
    produkEl.querySelector('[data-add-kondisi]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('bc-kondisi-add',{produkId:p.id});
    });

    /* Render kondisi list */
    const kondisiContainer=produkEl.querySelector(`#bc-kondisi-list-${p.id}`);
    if(!kondisiContainer){ area.appendChild(produkEl); return; }

    kondisiList.forEach((k,ki)=>{
      const kondisiEl=document.createElement('div');
      kondisiEl.className='bc-kondisi';
      kondisiEl.innerHTML=`
        <div class="bc-kondisi-head">
          ${isAdmin?`<div style="display:flex;flex-direction:column;gap:1px;flex-shrink:0">
            <button class="asset-act-btn" data-bc-k-up="${k.id}" title="Naik" style="font-size:.55rem;padding:1px 4px" ${ki===0?'disabled':''}>▲</button>
            <button class="asset-act-btn" data-bc-k-down="${k.id}" title="Turun" style="font-size:.55rem;padding:1px 4px" ${ki===kondisiList.length-1?'disabled':''}>▼</button>
          </div>`:''}
          <span class="bc-kondisi-name">${esc(k.kondisi||k.nama||'')}</span>
          <div class="bc-kondisi-acts">
            ${isAdmin?`<button class="asset-act-btn" data-bc-k-edit="${k.id}" title="Edit">✎</button>
            <button class="asset-act-btn del" data-bc-k-del="${k.id}" title="Hapus">✕</button>`:''}
          </div>
          <button class="bc-copy-btn" data-bc-copy="${k.id}" title="Salin caption broadcast">📋</button>
          <span class="bc-kondisi-chevron">▼</span>
        </div>
        <div class="bc-kondisi-body">
          <div class="bc-broadcast-text">${esc(k.broadcast||'')}</div>
          ${k.url?`<a class="bc-item-url" href="${esc(k.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(k.url)}</a>`:''}
        </div>
      `;

      kondisiEl.querySelector('.bc-kondisi-head').addEventListener('click',e=>{
        if(e.target.closest('.bc-kondisi-acts')||e.target.closest('[data-bc-k-up]')||e.target.closest('[data-bc-k-down]')||e.target.closest('[data-bc-copy]')) return;
        kondisiEl.classList.toggle('open');
      });

      /* Copy broadcast caption only */
      kondisiEl.querySelector('[data-bc-copy]').addEventListener('click',e=>{
        e.stopPropagation();
        const text=(k.broadcast||'').replace(/[​‌‍⁠﻿]/g,'');
        navigator.clipboard.writeText(text).then(()=>{
          const btn=kondisiEl.querySelector('[data-bc-copy]');
          const orig=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=orig,1200);
        }).catch(()=>{});
      });

      /* Reorder kondisi */
      kondisiEl.querySelector('[data-bc-k-up]')?.addEventListener('click',e=>{
        e.stopPropagation();
        const arr=p.kondisi.filter(x=>!x.deleted);
        const idx=arr.findIndex(x=>x.id===k.id);
        if(idx<=0) return;
        const realIdx=p.kondisi.indexOf(k);
        const prevActive=arr[idx-1];
        const prevRealIdx=p.kondisi.indexOf(prevActive);
        p.kondisi.splice(realIdx,1); p.kondisi.splice(prevRealIdx,0,k);
        touch(k); touch(p); save(); renderBroadcast();
      });
      kondisiEl.querySelector('[data-bc-k-down]')?.addEventListener('click',e=>{
        e.stopPropagation();
        const arr=p.kondisi.filter(x=>!x.deleted);
        const idx=arr.findIndex(x=>x.id===k.id);
        if(idx>=arr.length-1) return;
        const realIdx=p.kondisi.indexOf(k);
        const nextActive=arr[idx+1];
        const nextRealIdx=p.kondisi.indexOf(nextActive);
        p.kondisi.splice(realIdx,1); p.kondisi.splice(nextRealIdx,0,k);
        touch(k); touch(p); save(); renderBroadcast();
      });

      /* Edit kondisi */
      kondisiEl.querySelector('[data-bc-k-edit]')?.addEventListener('click',e=>{
        e.stopPropagation();
        openModal('bc-kondisi-edit',{id:k.id,produkId:p.id});
      });

      /* Delete kondisi */
      kondisiEl.querySelector('[data-bc-k-del]')?.addEventListener('click',e=>{
        e.stopPropagation();
        if(!confirm('Hapus kondisi ini?')) return;
        touch(Object.assign(k,{deleted:true}));
        touch(p); save(); renderBroadcast();
      });

      kondisiContainer.appendChild(kondisiEl);
    });

    area.appendChild(produkEl);
  });
}

/* ══════════════════════════════════════════
   LOMBA
══════════════════════════════════════════ */
function renderLomba(){
  const area=document.getElementById('lombaArea');
  area.innerHTML='';
  const isSuperAdmin=role==='admin';

  /* Toolbar */
  const toolbar=document.createElement('div');
  toolbar.className='notul-toolbar';
  toolbar.innerHTML=`<span class="notul-toolbar-title">🏆 Lomba</span>`;

  /* Filter jenis (pill) — di sebelah kiri searchbar */
  const jenisList=[...new Set((db.lombas||[]).filter(l=>!l.deleted&&l.jenis).map(l=>l.jenis))]
    .sort((a,b)=>a.localeCompare(b,'id'));
  /* filter jenis yang sudah tidak ada (mis. semua lombanya dihapus) → reset ke "Semua" */
  if(lombaJenisFilter && !jenisList.includes(lombaJenisFilter) && jenisList.length) lombaJenisFilter='';
  if(jenisList.length){
    const frow=document.createElement('div');
    frow.className='lomba-jenis-filter';
    frow.innerHTML=`<button class="lomba-jenis-pill${lombaJenisFilter===''?' active':''}" data-jf="">Semua</button>`
      +jenisList.map(j=>`<button class="lomba-jenis-pill${lombaJenisFilter===j?' active':''}" data-jf="${esc(j)}">${esc(j)}</button>`).join('');
    frow.querySelectorAll('[data-jf]').forEach(b=>b.addEventListener('click',()=>{
      lombaJenisFilter=b.dataset.jf;
      renderLomba();
    }));
    toolbar.appendChild(frow);
  }

  const searchInp=document.createElement('input');
  searchInp.className='asset-search';
  searchInp.id='lombaSearchInp';
  searchInp.placeholder='Cari lomba / jenis…';
  searchInp.value=lombaSearch;
  searchInp.style.maxWidth='200px';
  toolbar.appendChild(searchInp);

  if(isSuperAdmin){
    const jenisBtn=document.createElement('button');
    jenisBtn.className='notul-topik-add-btn';
    jenisBtn.style.cssText='margin:0;width:auto';
    jenisBtn.textContent='🏷 Kelola Jenis';
    jenisBtn.addEventListener('click',()=>openModal('jenis-list',{}));
    toolbar.appendChild(jenisBtn);

    const timBtn=document.createElement('button');
    timBtn.className='notul-topik-add-btn';
    timBtn.style.cssText='margin:0;width:auto';
    timBtn.textContent='👥 Kelola Tim';
    timBtn.addEventListener('click',()=>openModal('tim-list',{}));
    toolbar.appendChild(timBtn);

    const btn=document.createElement('button');
    btn.className='notul-topik-add-btn';
    btn.style.cssText='margin:0;width:auto';
    btn.textContent='＋ Tambah Lomba';
    btn.addEventListener('click',()=>openModal('lomba-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  area.querySelector('#lombaSearchInp').addEventListener('input',e=>{
    lombaSearch=e.target.value;
    const pos=e.target.selectionStart;
    renderLomba();
    const inp=document.getElementById('lombaSearchInp');
    if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(e){}}
  });

  const q=lombaSearch.trim().toLowerCase();
  const list=(db.lombas||[]).filter(l=>!l.deleted
    && (!q||String(l.nama||'').toLowerCase().includes(q)||String(l.jenis||'').toLowerCase().includes(q))
    && (!lombaJenisFilter||String(l.jenis||'')===lombaJenisFilter));
  if(!list.length){
    const empty=document.createElement('div');
    empty.style.cssText='padding:40px;text-align:center;color:var(--dim);font-size:.82rem';
    empty.textContent=lombaJenisFilter
      ? (q?`Tidak ada lomba dengan jenis "${lombaJenisFilter}" yang cocok dengan pencarian.`:`Tidak ada lomba dengan jenis "${lombaJenisFilter}".`)
      : (q?'Tidak ada lomba yang cocok.':'Belum ada lomba. Tambah lomba pertama!');
    area.appendChild(empty);
    return;
  }

  list.forEach(l=>{
    const ideList=(l.ide||[]).filter(x=>!x.deleted);
    /* polling: urut dari suara tertinggi, lalu terbaru */
    const sortedIde=[...ideList].sort((a,b)=>((b.likes||0)-(a.likes||0))||((b.createdAt||0)-(a.createdAt||0)));
    const totalSuara=sortedIde.reduce((s,i)=>s+(i.likes||0),0);
    const maxLikes=sortedIde.reduce((m,i)=>Math.max(m,i.likes||0),0);
    /* countdown */
    let countdownHtml='';
    if(l.regEnd){
      const today=new Date(); today.setHours(0,0,0,0);
      const end=new Date(l.regEnd); end.setHours(0,0,0,0);
      const diff=Math.round((end-today)/(1000*60*60*24));
      if(diff>0) countdownHtml=`<span style="color:${diff<=3?'var(--red,#f87171)':diff<=7?'#fbbf24':'var(--green,#34d399)'}">⏳ ${diff} hari lagi</span>`;
      else if(diff===0) countdownHtml=`<span style="color:var(--red,#f87171)">⏳ Tutup hari ini</span>`;
      else countdownHtml=`<span style="color:var(--dim)">Reg ditutup</span>`;
    }
    const card=document.createElement('div');
    card.className='notul-topik'+(openLombas.has(l.id)?' open':'');
    card.innerHTML=`
      <div class="notul-topik-head">
        <div class="notul-topik-icon">🏆</div>
        <div class="notul-topik-info">
          <div class="notul-topik-title">${esc(l.nama)}</div>
          <div class="notul-topik-meta">${[
            l.jenis?`Jenis: ${esc(l.jenis)}`:'',
            l.tim&&l.tim.name?`Tim: ${esc(l.tim.name)}${timMembers(l.tim).length?` (${timMembers(l.tim).length} anggota)`:''}`:'',
            (l.regStart||l.regEnd)?`Reg: ${esc(l.regStart||'?')} — ${esc(l.regEnd||'?')}`:'',
            countdownHtml,
            l.tanggalDaftar?`Daftar: ${esc(l.tanggalDaftar)}`:'',
            l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none" onclick="event.stopPropagation()">🔗 Link</a>`:'',
            `${ideList.length} ide`,
            `${totalSuara} suara`
          ].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="notul-topik-acts">
          ${isSuperAdmin?`<button class="asset-act-btn" data-lomba-edit="${l.id}" title="Edit">✎</button>
          <button class="asset-act-btn del" data-lomba-del="${l.id}" title="Hapus">✕</button>`:''}
        </div>
        <span class="notul-chevron">▼</span>
      </div>
      <div class="notul-topik-body" id="lomba-ide-list-${l.id}">
        <div class="lomba-poll-total">
          <span>🗳️ <b>${totalSuara}</b> suara</span>
          <span>·</span>
          <span>${ideList.length} ide</span>
          <span>·</span>
          <span>1 suara per lomba per perangkat</span>
        </div>
        ${l.tim&&l.tim.name?`
        <div class="tim-drop${openTim.has(l.id)?' open':''}" data-tim-drop="${l.id}">
          <div class="tim-drop-head">
            <span>👥</span>
            <span>Tim: <b>${esc(l.tim.name)}</b>${timMembers(l.tim).length?` · ${timMembers(l.tim).length} anggota`:''}</span>
            ${isSuperAdmin?`<button class="asset-act-btn" data-tim-edit="${l.id}" title="Ubah tim">✎</button>`:''}
            <span class="tim-drop-chev">▼</span>
          </div>
          <div class="tim-drop-body">
            ${timMembers(l.tim).length?`
            <table class="tim-members">
              <thead><tr><th>Nama</th><th style="width:86px">Peran</th><th style="width:120px">NIM / ID</th></tr></thead>
              <tbody>${timMembers(l.tim).map(m=>`
                <tr>
                  <td>${esc(m.name)}</td>
                  <td><span class="tim-peran-badge${m.peran==='ketua'?' ketua':''}">${m.peran==='ketua'?'Ketua':'Anggota'}</span></td>
                  <td>${esc(m.nim||'—')}</td>
                </tr>`).join('')}</tbody>
            </table>`:`<div class="tim-empty">Belum ada daftar anggota untuk tim ini.</div>`}
          </div>
        </div>`:''}
        <button class="notul-topik-add-btn" data-add-ide="${l.id}">${isSuperAdmin?'＋ Tambah Ide':'＋ Ajukan Ide'}</button>
      </div>
    `;

    /* Toggle open */
    card.querySelector('.notul-topik-head').addEventListener('click',e=>{
      if(e.target.closest('.notul-topik-acts')||e.target.closest('[data-add-ide]')) return;
      card.classList.toggle('open');
      if(card.classList.contains('open')) openLombas.add(l.id); else openLombas.delete(l.id);
    });

    /* Edit lomba */
    card.querySelector('[data-lomba-edit]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('lomba-edit',{id:l.id});
    });

    /* Delete lomba (cascade) */
    card.querySelector('[data-lomba-del]')?.addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm(`Hapus lomba "${l.nama}" dan ${ideList.length} idenya?`)) return;
      (l.ide||[]).forEach(ide=>touch(Object.assign(ide,{deleted:true})));
      touch(Object.assign(l,{deleted:true}));
      save(); renderLomba();
    });

    /* Add ide */
    card.querySelector('[data-add-ide]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('lomba-ide-add',{lombaId:l.id, authorRole:isSuperAdmin?'admin':'viewer'});
    });

    /* Dropdown anggota tim */
    const timDrop=card.querySelector('[data-tim-drop]');
    timDrop?.querySelector('.tim-drop-head')?.addEventListener('click',e=>{
      if(e.target.closest('[data-tim-edit]')) return;
      timDrop.classList.toggle('open');
      if(timDrop.classList.contains('open')) openTim.add(l.id); else openTim.delete(l.id);
    });
    timDrop?.querySelector('[data-tim-edit]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('lomba-edit',{id:l.id});
    });

    /* Render ide list */
    const ideContainer=card.querySelector(`#lomba-ide-list-${l.id}`);
    const lombaVote=getLombaVoteForLomba(l.id); // { ideId, vote } | null

    function doVote(ide,voteType){
      const prevIdeId=lombaVote?.ideId;
      const prevVote=lombaVote?.vote;
      /* undo: same ide same vote */
      if(prevIdeId===ide.id && prevVote===voteType){
        if(voteType==='like') ide.likes=Math.max(0,(ide.likes||0)-1);
        else ide.dislikes=Math.max(0,(ide.dislikes||0)-1);
        touch(ide);
        setLombaVoteForLomba(l.id,null,null);
      } else {
        /* remove old vote from previous ide if different ide */
        if(prevIdeId && prevIdeId!==ide.id){
          const prevIde=(l.ide||[]).find(x=>x.id===prevIdeId);
          if(prevIde){
            if(prevVote==='like') prevIde.likes=Math.max(0,(prevIde.likes||0)-1);
            else prevIde.dislikes=Math.max(0,(prevIde.dislikes||0)-1);
            touch(prevIde);
          }
        }
        /* remove same-ide opposite vote */
        if(prevIdeId===ide.id && prevVote && prevVote!==voteType){
          if(prevVote==='like') ide.likes=Math.max(0,(ide.likes||0)-1);
          else ide.dislikes=Math.max(0,(ide.dislikes||0)-1);
        }
        /* apply new vote */
        if(voteType==='like') ide.likes=(ide.likes||0)+1;
        else ide.dislikes=(ide.dislikes||0)+1;
        touch(ide);
        setLombaVoteForLomba(l.id,ide.id,voteType);
      }
      touch(l); save(); renderLomba();
    }

    sortedIde.forEach(ide=>{
      const myVote=(lombaVote?.ideId===ide.id)?lombaVote.vote:null;
      const likes=ide.likes||0;
      const dislikes=ide.dislikes||0;
      const pct=totalSuara?Math.round(likes/totalSuara*100):0;
      const isTop=maxLikes>0&&likes===maxLikes;
      const isMine=!!(ide.authorDevice&&ide.authorDevice===DEVICE_ID);
      const canDelete=isSuperAdmin||isMine;
      const authorLabel=ide.author||(ide.authorRole==='viewer'?'Anonim':'Tim');
      const authorCls=ide.authorRole==='viewer'?'viewer':'team';
      const ideEl=document.createElement('div');
      ideEl.className='lomba-ide-row';
      ideEl.innerHTML=`
        <div class="lomba-ide-main">
          <div style="font-size:.8rem;font-weight:600;color:var(--text)">${esc(ide.judul)}</div>
          ${ide.desc?`<div style="font-size:.72rem;color:var(--dim);margin-top:2px;white-space:pre-wrap;line-height:1.5">${esc(ide.desc)}</div>`:''}
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            <span class="lomba-ide-author ${authorCls}">👤 ${esc(authorLabel)}</span>
            ${ide.authorRole==='viewer'?'<span class="lomba-ide-author viewer">Usulan Viewer</span>':''}
            ${ide.promoted?'<span class="lomba-ide-author official">★ Resmi</span>':''}
            ${isTop?'<span class="lomba-ide-author top">🥇 Teratas</span>':''}
          </div>
          ${totalSuara?`<div class="lomba-poll-bar"><div class="lomba-poll-fill" style="width:${pct}%"></div></div>`:''}
          <div class="lomba-poll-meta">${totalSuara?`${pct}% dari ${totalSuara} suara`:'Belum ada suara — jadilah yang pertama memilih'}</div>
        </div>
        <div class="lomba-ide-acts" style="opacity:1">
          <button class="lomba-vote-btn${myVote==='like'?' active':''}" data-ide-like="${ide.id}" title="Pilih ide ini">👍 <span>${likes}</span></button>
          <button class="lomba-vote-btn${myVote==='dislike'?' active-dis':''}" data-ide-dislike="${ide.id}" title="Tidak suka">👎 <span>${dislikes}</span></button>
          ${isSuperAdmin?`<button class="asset-act-btn" data-ide-edit="${ide.id}" title="Edit">✎</button>`:''}
          ${isSuperAdmin?`<button class="asset-act-btn" data-ide-star="${ide.id}" title="${ide.promoted?'Batalkan status resmi':'Tandai resmi / terpilih'}">★</button>`:''}
          ${canDelete?`<button class="asset-act-btn del" data-ide-del="${ide.id}" title="Hapus">✕</button>`:''}
        </div>
      `;

      ideEl.querySelector('[data-ide-like]').addEventListener('click',e=>{ e.stopPropagation(); doVote(ide,'like'); });
      ideEl.querySelector('[data-ide-dislike]').addEventListener('click',e=>{ e.stopPropagation(); doVote(ide,'dislike'); });

      /* Edit ide */
      ideEl.querySelector('[data-ide-edit]')?.addEventListener('click',e=>{
        e.stopPropagation();
        openModal('lomba-ide-edit',{id:ide.id,lombaId:l.id,authorRole:ide.authorRole||'admin'});
      });

      /* Tandai resmi / terpilih (admin) */
      ideEl.querySelector('[data-ide-star]')?.addEventListener('click',e=>{
        e.stopPropagation();
        ide.promoted=!ide.promoted;
        touch(ide); touch(l); save(); renderLomba();
      });

      /* Delete ide */
      ideEl.querySelector('[data-ide-del]')?.addEventListener('click',e=>{
        e.stopPropagation();
        if(!confirm(`Hapus ide "${ide.judul}"?`)) return;
        touch(Object.assign(ide,{deleted:true}));
        touch(l); save(); renderLomba();
      });

      ideContainer.insertBefore(ideEl,ideContainer.querySelector('[data-add-ide]'));
    });

    area.appendChild(card);
  });
}

/* ══════════════════════════════════════════
   RUANGAN
══════════════════════════════════════════ */
function renderRuangan(){
  const area=document.getElementById('ruanganArea');
  area.innerHTML='';
  const isAdmin=role==='admin';

  /* Toolbar */
  const toolbar=document.createElement('div');
  toolbar.className='notul-toolbar';
  toolbar.innerHTML=`<span class="notul-toolbar-title">🏠 Ruangan</span>
    <input class="asset-search" id="ruanganSearchInp" placeholder="Cari ruangan…" value="${esc(ruanganSearch)}" style="max-width:180px"/>`;
  if(isAdmin){
    const btn=document.createElement('button');
    btn.className='notul-topik-add-btn';
    btn.style.cssText='margin:0;width:auto';
    btn.textContent='＋ Tambah';
    btn.addEventListener('click',()=>openModal('ruangan-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  area.querySelector('#ruanganSearchInp').addEventListener('input',e=>{
    ruanganSearch=e.target.value;
    const pos=e.target.selectionStart;
    renderRuangan();
    const inp=document.getElementById('ruanganSearchInp');
    if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(e){}}
  });

  const q=ruanganSearch.trim().toLowerCase();
  const list=(db.ruangan||[]).filter(r=>!r.deleted&&(!q||r.nama.toLowerCase().includes(q)||(r.lokasi||'').toLowerCase().includes(q)));

  if(!list.length){
    const empty=document.createElement('div');
    empty.style.cssText='padding:40px;text-align:center;color:var(--dim);font-size:.82rem';
    empty.textContent=q?'Tidak ada ruangan yang cocok.':'Belum ada ruangan. Tambah ruangan pertama!';
    area.appendChild(empty);
    return;
  }

  /* Sort: aktif dulu, lalu terjadwal, lalu nama */
  const nowSort=new Date();
  function ruSort(r){
    if(r.status!=='aktif') return 2;
    if(r.tglKegiatan&&r.waktuMulai&&new Date(r.tglKegiatan+'T'+r.waktuMulai)>nowSort) return 1;
    return 0;
  }
  const sorted=list.slice().sort((a,b)=>ruSort(a)-ruSort(b)||a.nama.localeCompare(b.nama,'id'));

  const nowCard=new Date();
  function ruEffective(r){
    let isAktif=r.status==='aktif', isTerjadwal=false;
    if(isAktif&&r.tglKegiatan&&r.waktuMulai&&new Date(r.tglKegiatan+'T'+r.waktuMulai)>nowCard){
      isAktif=false; isTerjadwal=true;
    }
    return {isAktif,isTerjadwal};
  }

  function makeCard(r){
    const {isAktif,isTerjadwal}=ruEffective(r);
    const card=document.createElement('div');
    card.className=`ruangan-card ${isAktif?'aktif':'idle'}`;
    card.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px">
        <div class="ruangan-status-dot ${isAktif?'aktif':'idle'}"></div>
        <span style="font-size:.88rem;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.nama)}</span>
        <span style="font-size:.58rem;font-weight:700;padding:1px 7px;border-radius:8px;border:1px solid var(--bd);color:var(--dim);white-space:nowrap">${esc(r.tipe||'internal')}</span>
      </div>
      <div style="font-size:.8rem;font-weight:700;color:${isAktif?'var(--green,#34d399)':isTerjadwal?'var(--accent)':'var(--muted)'}">
        ${isAktif?'Aktif':isTerjadwal?'🕐 Terjadwal':'Idle'}
      </div>
      ${r.status==='aktif'&&r.kegiatan?`<div style="font-size:.72rem;color:var(--text);background:var(--surface);border-radius:7px;padding:7px 10px;display:flex;flex-direction:column;gap:3px">
        <div><span style="color:var(--muted);font-size:.62rem;font-weight:700">KEGIATAN</span><br>${esc(r.kegiatan)}</div>
        <div><span style="color:var(--muted);font-size:.62rem;font-weight:700">PIC</span><br>${esc(r.pic||'—')}</div>
        ${r.tglKegiatan||r.waktuMulai?`<div style="color:var(--muted);font-size:.62rem;margin-top:2px">🗓 ${r.tglKegiatan?new Date(r.tglKegiatan+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):''} ${r.waktuMulai?r.waktuMulai:''} ${r.waktuSelesai?'– '+r.waktuSelesai:''}</div>`:''}
      </div>`:''}
      ${r.lokasi?(r.tipe==='eksternal'?`<a href="${esc(r.lokasi)}" target="_blank" rel="noopener" style="font-size:.68rem;color:var(--accent);text-decoration:none">📍 Lihat Lokasi ↗</a>`:`<div style="font-size:.68rem;color:var(--dim)">📍 ${esc(r.lokasi)}</div>`):''}
      ${r.tipe==='eksternal'?`<div style="font-size:.68rem;color:var(--dim)">👥 Unlimited</div>`:(r.kapasitas?`<div style="font-size:.68rem;color:var(--dim)">👥 Maks. ${r.kapasitas} orang</div>`:'')}
      ${r.catatan?`<div style="font-size:.68rem;color:var(--dim);white-space:pre-wrap">${esc(r.catatan)}</div>`:''}
      ${isAdmin?`<div style="display:flex;gap:6px;margin-top:2px;flex-wrap:wrap">
        ${isAktif||isTerjadwal
          ?`<button class="task-add-inline-btn" data-ru-idle="${r.id}" style="flex:1;font-size:.7rem">↩ Set Idle</button>`
          :`<button class="task-add-inline-btn" data-ru-aktif="${r.id}" style="flex:1;font-size:.7rem;border-color:var(--green,#34d399);color:var(--green,#34d399)">▶ Set Aktif</button>`
        }
        <button class="asset-act-btn" data-ru-edit="${r.id}" title="Edit">✎</button>
        <button class="asset-act-btn del" data-ru-del="${r.id}" title="Hapus">✕</button>
      </div>`:''}
    `;
    card.querySelector('[data-ru-aktif]')?.addEventListener('click',()=>openModal('ruangan-pakai',{id:r.id}));
    card.querySelector('[data-ru-idle]')?.addEventListener('click',()=>{
      r.status='idle'; r.kegiatan=null; r.pic=null; r.tglKegiatan=null; r.waktuMulai=null; r.waktuSelesai=null;
      touch(r); save(); renderRuangan();
    });
    card.querySelector('[data-ru-edit]')?.addEventListener('click',()=>openModal('ruangan-edit',{id:r.id}));
    card.querySelector('[data-ru-del]')?.addEventListener('click',()=>{
      if(!confirm(`Hapus ruangan "${r.nama}"?`)) return;
      touch(Object.assign(r,{deleted:true})); save(); renderRuangan();
    });
    return card;
  }

  function makeSection(items, label){
    const wrap=document.createElement('div');
    const hdr=document.createElement('div');
    hdr.style.cssText='padding:14px 16px 2px;font-size:.65rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase';
    hdr.textContent=label;
    wrap.appendChild(hdr);
    const grid=document.createElement('div');
    grid.className='ruangan-grid';
    items.forEach(r=>grid.appendChild(makeCard(r)));
    wrap.appendChild(grid);
    return wrap;
  }

  const aktifList=sorted.filter(r=>{ const e=ruEffective(r); return e.isAktif||e.isTerjadwal; });
  const idleList=sorted.filter(r=>{ const e=ruEffective(r); return !e.isAktif&&!e.isTerjadwal; });

  if(aktifList.length){
    area.appendChild(makeSection(aktifList,'Berlangsung / Terjadwal'));
    if(idleList.length){
      const sep=document.createElement('div');
      sep.style.cssText='height:1px;background:var(--border);margin:4px 16px 0';
      area.appendChild(sep);
    }
  }
  if(idleList.length) area.appendChild(makeSection(idleList,'Idle'));
}

/* ══════════════════════════════════════════
   BAHAN PERS
══════════════════════════════════════════ */
function renderPers(){
  const area=document.getElementById('persArea');
  area.innerHTML='';
  const isAdmin=role==='admin';

  const STATUS_LABEL={pengajuan:'📋 Pengajuan',proses:'⚙️ Proses',review:'🔍 Review',disetujui:'✅ Disetujui',ditolak:'❌ Ditolak'};
  const STATUS_COLOR={pengajuan:'var(--dim)',proses:'#fbbf24',review:'var(--accent)',disetujui:'var(--green,#34d399)',ditolak:'var(--red,#f87171)'};

  /* Toolbar */
  const toolbar=document.createElement('div');
  toolbar.className='notul-toolbar';
  toolbar.innerHTML=`<span class="notul-toolbar-title">📰 Pers</span>
    <input class="asset-search" id="persSearchInp" placeholder="Cari bahan…" value="${esc(persSearch)}" style="max-width:200px"/>`;
  if(isAdmin){
    const btn=document.createElement('button');
    btn.className='notul-topik-add-btn';
    btn.style.cssText='margin:0;width:auto';
    btn.textContent='＋ Tambah';
    btn.addEventListener('click',()=>openModal('pers-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  area.querySelector('#persSearchInp').addEventListener('input',e=>{
    persSearch=e.target.value;
    const pos=e.target.selectionStart;
    renderPers();
    const inp=document.getElementById('persSearchInp');
    if(inp){inp.focus();try{inp.setSelectionRange(pos,pos);}catch(e){}}
  });

  const q=persSearch.trim().toLowerCase();
  const list=(db.bahanPers||[]).filter(p=>!p.deleted&&(!q||p.judul.toLowerCase().includes(q)||(p.kategori||'').toLowerCase().includes(q)||(p.platform||'').toLowerCase().includes(q)));

  if(!list.length){
    const empty=document.createElement('div');
    empty.style.cssText='padding:40px;text-align:center;color:var(--dim);font-size:.82rem';
    empty.textContent=q?'Tidak ada bahan yang cocok.':'Belum ada bahan pers. Tambah bahan pertama!';
    area.appendChild(empty);
    return;
  }

  /* Group by status for ordering: pengajuan → proses → review → disetujui → ditolak */
  const order={pengajuan:0,proses:1,review:2,disetujui:3,ditolak:4};
  const sorted=list.slice().sort((a,b)=>(order[a.status||'pengajuan']??0)-(order[b.status||'pengajuan']??0)||(a.tanggalPublish||'').localeCompare(b.tanggalPublish||'')||(a.judul||'').localeCompare(b.judul||'','id'));

  sorted.forEach(p=>{
    const statusLabel=STATUS_LABEL[p.status]||p.status||'Draft';
    const statusColor=STATUS_COLOR[p.status]||'var(--dim)';

    /* Countdown to deadline */
    let countdownHtml='';
    if(p.tanggalPublish&&p.status!=='disetujui'&&p.status!=='ditolak'){
      const today=new Date(); today.setHours(0,0,0,0);
      const pub=new Date(p.tanggalPublish); pub.setHours(0,0,0,0);
      const diff=Math.round((pub-today)/(1000*60*60*24));
      if(diff>0) countdownHtml=`<span style="color:${diff<=3?'var(--red,#f87171)':diff<=7?'#fbbf24':'var(--dim)'}">⏰ ${diff}h lagi</span>`;
      else if(diff===0) countdownHtml=`<span style="color:var(--red,#f87171)">⏰ Hari ini</span>`;
      else if(diff<0) countdownHtml=`<span style="color:var(--red,#f87171)">⚠ Terlambat ${Math.abs(diff)}h</span>`;
    }

    const meta=[
      p.tanggalPublish?`<span style="font-size:.6rem;color:var(--dim)">⏳ Deadline: ${esc(p.tanggalPublish)}</span>`:'',
      countdownHtml,
    ].filter(Boolean).join(' ');

    const card=document.createElement('div');
    card.className='notul-topik';
    card.innerHTML=`
      <div class="notul-topik-head" style="cursor:default">
        <div class="notul-topik-icon">📰</div>
        <div class="notul-topik-info" style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="notul-topik-title">${esc(p.judul)}</span>
            <span style="font-size:.65rem;font-weight:700;color:${statusColor};white-space:nowrap">${statusLabel}</span>
          </div>
          ${meta?`<div class="notul-topik-meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px">${meta}</div>`:''}
          ${p.urlDesain?`<div style="margin-top:4px"><a href="${esc(p.urlDesain)}" target="_blank" rel="noopener" style="font-size:.68rem;color:var(--accent);text-decoration:none">🎨 Lihat Desain →</a></div>`:''}
          ${p.catatan?`<div style="font-size:.72rem;color:var(--dim);margin-top:4px;white-space:pre-wrap;line-height:1.5">${esc(p.catatan)}</div>`:''}
        </div>
        <div class="notul-topik-acts">
          ${isAdmin?`<button class="asset-act-btn" data-pers-edit="${p.id}" title="Edit">✎</button>
          <button class="asset-act-btn del" data-pers-del="${p.id}" title="Hapus">✕</button>`:''}
        </div>
      </div>
    `;

    card.querySelector('[data-pers-edit]')?.addEventListener('click',e=>{
      e.stopPropagation();
      openModal('pers-edit',{id:p.id});
    });
    card.querySelector('[data-pers-del]')?.addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm(`Hapus "${p.judul}"?`)) return;
      touch(Object.assign(p,{deleted:true}));
      save(); renderPers();
    });

    area.appendChild(card);
  });
}

/* ══════════════════════════════════════════
   FORCE SEND NOTIFICATION
══════════════════════════════════════════ */
async function forceSendNotif(btn){
  if(!WORKER_URL){ alert('WORKER_URL belum dikonfigurasi.'); return; }

  const origText = btn.textContent;
  btn.textContent = 'Mengirim...';
  btn.disabled = true;

  try {
    const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Jakarta' });
    const qualifying = (db.events||[]).filter(ev => {
      if(ev.deleted) return false;
      if(ev.type === 'once') return ev.date && ev.date >= today;
      if(ev.type === 'recurring') return true;
      return false;
    });
    if(!qualifying.length){
      alert('Tidak ada pemberitahuan aktif.');
      btn.textContent = origText; btn.disabled = false; return;
    }

    const DAY_NAMES   = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    const MONTH_NAMES = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
    const REC_LABELS  = { harian:'setiap hari', mingguan:'setiap minggu', bulanan:'setiap bulan', tahunan:'setiap tahun' };
    const orgName = db.orgName || 'Alteco';

    function timeLabel(ev){
      if(ev.type === 'recurring') return REC_LABELS[ev.recurrence] || 'berulang';
      if(ev.date === today) return 'Hari ini';
      const diff = Math.round((new Date(ev.date) - new Date(today)) / 86400000);
      const d = new Date(ev.date + 'T00:00:00');
      return `${diff} hari lagi · ${DAY_NAMES[d.getDay()]}, ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;
    }

    let heading, bodyText;
    if(qualifying.length === 1){
      const ev = qualifying[0];
      heading  = `📌 ${orgName}`;
      bodyText = `${ev.title}\n📅 ${timeLabel(ev)}` + (ev.description?.trim() ? `\n${ev.description.trim()}` : '');
    } else {
      heading  = `📌 ${orgName} — ${qualifying.length} Pengumuman`;
      bodyText = qualifying.map(ev => {
        let line = `• ${ev.title} — ${timeLabel(ev)}`;
        if(ev.description?.trim()) line += `\n  ${ev.description.trim()}`;
        return line;
      }).join('\n');
    }

    const resp = await fetch(`${WORKER_URL}/notify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        included_segments: ['All'],
        headings: { en: heading, id: heading },
        contents: { en: bodyText, id: bodyText },
        url: 'https://dionisiusnp.github.io/todolist/'
      })
    });
    const result = await resp.json();
    if(!resp.ok) throw new Error(typeof result.error === 'object' ? JSON.stringify(result.error) : (result.error || `HTTP ${resp.status}`));
    btn.textContent = '✓ Terkirim';
    setTimeout(()=>{ btn.textContent=origText; btn.disabled=false; }, 3000);
  } catch(e){
    alert('Gagal kirim notif: ' + e.message);
    btn.textContent = origText;
    btn.disabled = false;
  }
}

/* ══════════════════════════════════════════
   NOTIFICATION HELPERS
══════════════════════════════════════════ */
function getTodayEvents(){
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  const globalDaysBefore = db.settings?.notifDaysBefore ?? 1;
  return (db.events||[]).filter(ev=>{
    if(ev.deleted) return false;
    if(ev.type==='once'){
      if(!ev.date) return false;
      const start = new Date(ev.date+'T00:00:00');
      start.setDate(start.getDate()-globalDaysBefore);
      return today>=start.toISOString().slice(0,10) && today<=ev.date;
    }
    if(ev.type==='recurring'){
      if(ev.recurDate && today < ev.recurDate) return false;
      if(ev.recurrence==='harian') return true;
      /* berulang: notif hanya PADA hari H sesuai recurDate */
      const base = ev.recurDate ? new Date(ev.recurDate+'T00:00:00') : null;
      if(ev.recurrence==='mingguan')
        return base ? now.getDay()===base.getDay() : now.getDay()===1;
      if(ev.recurrence==='bulanan')
        return base ? now.getDate()===base.getDate() : now.getDate()===1;
      if(ev.recurrence==='tahunan')
        return base ? (now.getMonth()===base.getMonth()&&now.getDate()===base.getDate()) : false;
    }
    return false;
  });
}

function updateBellBadge(){
  const lastRead = parseInt(localStorage.getItem('alteco_info_read_ts')||'0');
  const unread = (db.events||[]).filter(ev=>!ev.deleted&&Math.max(ev.createdAt||0, ev.updatedAt||0)>lastRead).length;
  const nb = document.getElementById('rmNotifBadge');
  if(nb){ if(unread>0){nb.textContent=unread;nb.style.display='';} else nb.style.display='none'; }
}

function checkLocalNotif(){
  if(db.settings?.pushNotifEnabled) return;
  if(!('Notification' in window)) return;
  const today = new Date().toISOString().slice(0,10);
  const lastKey = 'alteco_notif_date';
  if(localStorage.getItem(lastKey)===today) return;

  const todayEvents = getTodayEvents();
  if(!todayEvents.length) return;

  function showNotifs(){
    localStorage.setItem(lastKey, today);
    todayEvents.forEach(ev=>{
      new Notification('📌 Alteco — '+ev.title, {
        body: ev.desc||'Event hari ini',
        icon: '/favicon.ico'
      });
    });
    updateBellBadge();
  }

  if(Notification.permission==='granted'){
    showNotifs();
  } else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(p=>{ if(p==='granted') showNotifs(); });
  }
}

/* ══════════════════════════════════════════
   ONESIGNAL
══════════════════════════════════════════ */
function initOneSignal(){
  if(!db.settings?.pushNotifEnabled) return;
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({ appId: ONESIGNAL_APP_ID, notifyButton: { enable: false } });
  });
}

function loadOneSignalSDK(){
  if(document.getElementById('onesignal-sdk')) return;
  const s=document.createElement('script');
  s.id='onesignal-sdk';
  s.src='https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
  s.defer=true;
  s.onload=()=>initOneSignal();
  document.head.appendChild(s);
}
