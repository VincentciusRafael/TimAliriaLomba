<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kelola Alteco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b12;--surface:#12121c;--card:#181825;--bd:#23233a;
  --text:#e2e2f0;--muted:#9494b8;--dim:#5c5c7a;
  --accent:#6c6ff5;--accent2:#a78bfa;
  --green:#34d399;--red:#f87171;--gold:#fbbf24;--blue:#60a5fa;--teal:#2dd4bf;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#f4f4f9;--surface:#eaeaef;--card:#dfdfec;--bd:#c5c5d4;
  --text:#15152a;--muted:#6a6a88;--dim:#9090aa;
  --accent:#5356d1;--accent2:#8b5cf6;
  --green:#059669;--red:#dc2626;--gold:#ca8a04;--blue:#2563eb;--teal:#0d9488;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;transition:background .25s,color .25s}
input,button,select,textarea{font-family:var(--font)}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

/* ── Gate ── */
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;transition:background .25s}
#gate.hidden{display:none}
.gate-box{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:40px 36px;max-width:340px;width:100%;text-align:center}
.gate-ico{font-size:2rem;margin-bottom:14px}
.gate-org{font-size:1.2rem;font-weight:900;letter-spacing:-.03em;margin-bottom:4px}
.gate-sub{font-size:.72rem;color:var(--muted);margin-bottom:24px;transition:color .25s}
.gate-input{width:100%;padding:10px 14px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-family:var(--mono);font-size:1rem;letter-spacing:.2em;text-align:center;outline:none;transition:border-color .15s,background .25s;margin-bottom:10px}
.gate-input:focus{border-color:var(--accent)}
.gate-input.error{border-color:var(--red);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gate-btn{width:100%;padding:10px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;transition:background .15s}
.gate-btn:hover{background:var(--accent2)}
.gate-err{font-size:.7rem;color:var(--red);margin-top:8px;min-height:14px}

/* ── Modal ── */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.modal-box{position:relative;background:var(--surface);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:420px;max-height:90vh;display:flex;flex-direction:column;z-index:1;transition:background .25s}
.modal-head{display:flex;align-items:center;padding:16px 20px 12px;border-bottom:1px solid var(--bd);transition:border-color .25s}
.modal-title{font-size:.9rem;font-weight:800;flex:1}
.modal-close{width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--red);border-color:var(--red);color:#fff}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1;min-height:0}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.form-input,.form-select,.form-textarea{padding:8px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.82rem;outline:none;transition:border-color .15s,background .25s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:60px;max-height:120px}
.repeater{display:flex;flex-direction:column;gap:8px}
.repeater-row{display:flex;gap:6px;align-items:flex-start;background:var(--surface);border:1px solid var(--bd);border-radius:8px;padding:10px 10px 10px 12px;transition:border-color .15s}
.repeater-row:hover{border-color:var(--accent)}
.repeater-fields{flex:1;display:flex;flex-direction:column;gap:6px}
.repeater-del{flex-shrink:0;width:26px;height:26px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:1px}
.repeater-del:hover{border-color:var(--red);color:var(--red)}
.repeater-add{align-self:flex-start;margin-top:2px;font-size:.72rem;font-weight:600;padding:4px 12px;border-radius:6px;border:1px dashed var(--bd);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.repeater-add:hover{border-color:var(--accent);color:var(--accent)}
input[type="date"].form-input{color-scheme:dark}
[data-theme="light"] input[type="date"].form-input{color-scheme:light}
.form-select option{background:var(--card)}
.type-toggle{display:flex;gap:6px}
.type-btn{flex:1;padding:8px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--muted);font-size:.78rem;font-weight:600;transition:all .15s;text-align:center}
.type-btn.active-recurring{background:rgba(108,111,245,.15);border-color:rgba(108,111,245,.4);color:var(--accent)}
.type-btn.active-once{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35);color:var(--gold)}
.recur-row{display:flex;gap:6px;flex-wrap:wrap}
.recur-opt{font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);cursor:pointer;transition:all .15s}
.recur-opt.active{background:rgba(108,111,245,.15);border-color:rgba(108,111,245,.4);color:var(--accent)}
.modal-foot{flex-shrink:0;display:flex;gap:8px;padding:12px 20px 18px;justify-content:flex-end;border-top:1px solid var(--bd)}
.btn-cancel{padding:8px 16px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--muted);font-size:.78rem;font-weight:600;transition:all .15s}
.btn-cancel:hover{border-color:var(--text);color:var(--text)}
.btn-save{padding:8px 18px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;transition:background .15s}
.btn-save:hover{background:var(--accent2)}

/* ── Nav ── */
.nav{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--bd);transition:background .25s,border-color .25s}
.nav-back{font-size:.72rem;font-weight:600;color:var(--muted);padding:4px 12px;border:1px solid var(--bd);border-radius:5px;text-decoration:none;transition:color .15s,border-color .15s}
.nav-back:hover{color:var(--accent);border-color:var(--accent)}
.nav-title{font-size:.82rem;font-weight:700}
.nav-spacer{flex:1}
.nav-role-badge{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid;letter-spacing:.05em;text-transform:uppercase}
.role-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);min-width:160px;z-index:9000;overflow:hidden;display:none}
.role-menu.open{display:block}
.role-menu-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:.76rem;color:var(--text);cursor:pointer;transition:background .1s;white-space:nowrap;border:none;background:none;width:100%;text-align:left}
.role-menu-item:hover{background:var(--surface)}
.role-menu-item.danger{color:var(--red,#f87171)}
.role-menu-divider{height:1px;background:var(--border);margin:2px 0}
.nav-role-badge.admin{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35);color:var(--gold)}
.nav-role-badge.viewer{background:rgba(148,148,184,.08);border-color:var(--bd);color:var(--dim)}
.theme-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,color .2s;font-size:14px;line-height:1}
.theme-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── App ── */
.app{flex:1;display:flex;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:var(--surface);transition:background .25s,border-color .25s,width .2s}
.sidebar-head{padding:10px 12px 6px;flex-shrink:0;display:flex;align-items:center;transition:border-color .25s}
.feature-nav{display:flex;flex-direction:column;gap:1px;padding:4px 6px 6px;flex-shrink:0;border-bottom:1px solid var(--bd);transition:border-color .25s}
.feature-nav-group{font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 10px 2px;margin-top:2px;transition:opacity .15s}
.feature-nav-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s,justify-content .15s;font-size:.78rem;font-weight:500}
.feature-nav-item:hover{background:var(--card);color:var(--text)}
.feature-nav-item.active{background:rgba(108,111,245,.12);color:var(--accent);font-weight:600}
.feature-nav-ico{font-size:.9rem;flex-shrink:0;width:18px;text-align:center}
.feature-nav-label{flex:1;transition:opacity .15s,width .15s}
.sidebar-head-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:1;transition:opacity .15s}
/* sidebar toggle button */
.sb-toggle-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.7rem;cursor:pointer;flex-shrink:0;transition:all .15s;line-height:1}
.sb-toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
/* minimized sidebar */
.sidebar.sb-mini{width:48px}
.sidebar.sb-mini .sidebar-head-title,
.sidebar.sb-mini .feature-nav-group,
.sidebar.sb-mini .feature-nav-label,
.sidebar.sb-mini .all-label,
.sidebar.sb-mini .all-count,
.sidebar.sb-mini .all-avatar,
.sidebar.sb-mini .people-scroll,
.sidebar.sb-mini .sb-mini-hide{display:none!important}
.sidebar.sb-mini .sidebar-head{justify-content:center;padding:10px 6px 6px}
.sidebar.sb-mini .feature-nav{padding:4px 4px 6px}
.sidebar.sb-mini .feature-nav-item{justify-content:center;padding:7px 4px;gap:0}
.sidebar.sb-mini .all-item{justify-content:center;padding:7px 4px}
.sidebar.sb-mini .feature-nav-ico{width:auto}
.add-btn{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);transition:all .15s}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.admin-only{display:none!important}
body.is-admin .admin-only{display:flex!important}
.viewer-only{display:flex}
body.is-admin .viewer-only{display:none!important}

.all-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;margin:6px 6px 2px;border:1px solid transparent;transition:background .15s}
.all-item:hover{background:var(--card)}
.all-item.active{background:rgba(108,111,245,.12);border-color:rgba(108,111,245,.25)}
.all-item.active .all-label{color:var(--accent)}
.all-avatar{width:26px;height:26px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:.68rem;flex-shrink:0}
.all-item.active .all-avatar{background:rgba(108,111,245,.2);border:1px solid rgba(108,111,245,.35)}
.all-label{font-size:.78rem;font-weight:700;flex:1}
.all-count{font-size:.6rem;font-family:var(--mono);color:var(--dim)}

.divider{height:1px;background:var(--bd);margin:4px 10px;transition:background .25s}
.people-scroll{flex:1;overflow-y:auto;padding:4px 6px 6px}

.kelompok-block{margin-bottom:4px}
.kelompok-label{display:flex;align-items:center;gap:5px;padding:6px 10px 3px;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);overflow:hidden}
.kelompok-chevron{font-size:.5rem;flex-shrink:0;transition:transform .2s;display:inline-block}
.kelompok-body{overflow:hidden}
.kelompok-name-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-actions{display:flex;gap:2px;align-items:center;flex-shrink:0;opacity:0;transition:opacity .15s}
.kelompok-label:hover .grp-actions{opacity:1}
.grp-act-btn{width:16px;height:16px;border-radius:3px;border:none;background:transparent;color:var(--dim);font-size:.6rem;display:flex;align-items:center;justify-content:center;transition:color .15s;flex-shrink:0}
.grp-act-btn:hover{color:var(--text)}
.grp-act-btn.del:hover{color:var(--red)}

.member-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:background .15s}
.member-item:hover{background:var(--card)}
.member-item.active{background:rgba(108,111,245,.12);border-color:rgba(108,111,245,.25)}
.member-item.active .member-name{color:var(--accent)}
.member-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0;background:var(--bd);color:var(--text)}
.member-item.active .member-avatar{background:rgba(108,111,245,.2);border:1px solid rgba(108,111,245,.35);color:var(--accent)}
.member-info{flex:1;min-width:0}
.member-name{font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:3px}
.member-role{font-size:.6rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.member-task-count{font-size:.58rem;font-family:var(--mono);color:var(--dim);flex-shrink:0}
.member-actions{display:none;gap:2px;flex-shrink:0}
.member-item:hover .member-actions{display:flex}
.member-item:hover .member-task-count{display:none}
.m-act-btn{width:16px;height:16px;border-radius:3px;border:none;background:transparent;color:var(--dim);font-size:.6rem;display:flex;align-items:center;justify-content:center}
.m-act-btn:hover{color:var(--text)}
.m-act-btn.del:hover{color:var(--red)}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);text-align:center;padding:24px}
.main-empty .ico{font-size:2rem;margin-bottom:8px}
.main-empty p{font-size:.75rem;line-height:1.6;max-width:220px}

/* Member header */
.member-header{padding:14px 18px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;display:flex;align-items:center;gap:12px;transition:border-color .25s}
.mh-avatar{width:38px;height:38px;border-radius:50%;background:rgba(108,111,245,.15);border:1px solid rgba(108,111,245,.3);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--accent);flex-shrink:0}
.mh-name{font-size:.95rem;font-weight:800;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:4px}
.fn-info-btn{display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--accent);opacity:.55;cursor:pointer;transition:opacity .15s;flex-shrink:0;line-height:1;user-select:none}
.fn-info-btn:hover{opacity:1}
.mh-sub{font-size:.68rem;color:var(--muted);margin-top:1px;transition:color .25s}
.mh-spacer{flex:1}
.mh-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:28px;height:28px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* Task area */
.task-area{flex:1;overflow-y:auto;padding:10px 14px 16px}

/* Filter row */
.filter-row{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--bd);flex-shrink:0;transition:border-color .25s;flex-wrap:wrap}
.filter-label{font-size:.62rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.search-input{flex:1;min-width:100px;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.74rem;outline:none;transition:border-color .15s,background .25s}
.member-search-wrap{position:relative;min-width:130px;max-width:190px}
.member-search-input{width:100%;padding:4px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.74rem;outline:none;transition:border-color .15s,background .25s}
.member-search-input:focus{border-color:var(--accent)}
.member-search-input::placeholder{color:var(--dim)}
.member-search-list{position:fixed;background:var(--surface);border:1px solid var(--bd);border-radius:7px;z-index:9000;max-height:220px;overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.35);display:none}
.member-search-item{padding:6px 12px;font-size:.78rem;cursor:pointer;white-space:nowrap;transition:background .1s}
.member-search-item:hover,.member-search-item.selected{background:rgba(108,111,245,.15);color:var(--accent)}
.ruangan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding:16px}
.ruangan-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.ruangan-card.aktif{border-color:rgba(52,211,153,.4)}
.ruangan-card.idle{border-color:var(--border)}
.ruangan-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ruangan-status-dot.idle{background:var(--muted,#6b7280)}
.ruangan-status-dot.aktif{background:var(--green,#34d399);box-shadow:0 0 6px rgba(52,211,153,.5)}
.proj-badge-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.proj-badge{font-size:.6rem;font-weight:600;padding:2px 7px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);opacity:.8;white-space:nowrap}
.mss-item{padding:7px 12px;cursor:pointer;font-size:.78rem;transition:background .1s;color:var(--text)}
.mss-item:hover,.mss-item.mss-sel{background:var(--surface)}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--dim)}
.filter-divider{width:1px;height:16px;background:var(--bd);flex-shrink:0}
.filter-btn{font-size:.64rem;font-weight:600;padding:3px 9px;border-radius:4px;border:1px solid var(--bd);background:var(--card);color:var(--muted);transition:all .15s}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Asset view ── */
.asset-view{flex:1;overflow-y:auto;padding:14px 18px}
.asset-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.asset-toolbar-title{font-size:.82rem;font-weight:800;flex:1}
.asset-search{flex:1;min-width:120px;padding:5px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.76rem;outline:none;transition:border-color .15s}
.asset-search:focus{border-color:var(--accent)}
.asset-search::placeholder{color:var(--dim)}
.asset-cat-select{padding:5px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.76rem;outline:none;transition:border-color .15s}
.asset-cat-select:focus{border-color:var(--accent)}
.asset-cat-select option{background:var(--card)}
.asset-table{width:100%;border-collapse:collapse;font-size:.78rem}
.asset-table th{text-align:left;font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--bd)}
.asset-table td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.asset-table tr:last-child td{border-bottom:none}
.asset-table tr:hover td{background:var(--card)}
.asset-cond{font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid transparent}
.asset-cond.baik{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3);color:var(--green)}
.asset-cond.ringan{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:var(--gold)}
.asset-cond.berat{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--red)}
.asset-act-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--bd);background:transparent;color:var(--dim);font-size:.7rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.asset-act-btn:hover{border-color:var(--accent);color:var(--accent)}
.asset-act-btn.del:hover{border-color:var(--red);color:var(--red)}
.asset-empty{text-align:center;color:var(--dim);font-size:.78rem;padding:40px 0}

/* ── Org chart ── */
.org-view{flex:1;overflow:auto;padding:32px 24px}
.org-level-row{display:flex;gap:16px;justify-content:center;flex-shrink:0}
.org-root-node{background:var(--accent);color:#fff;border-radius:10px;padding:10px 24px;font-size:.9rem;font-weight:800;letter-spacing:-.01em;text-align:center;flex-shrink:0}
.org-level-row{display:flex;gap:16px;justify-content:center;flex-shrink:0}
.org-kelompok-node{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:.74rem;font-weight:700;color:var(--accent);text-align:center;width:148px;flex-shrink:0;cursor:pointer;user-select:none;transition:background .15s,border-color .15s}
.org-kelompok-node.depth-1{background:var(--card);border:1.5px solid var(--bd);color:var(--muted)}
.org-kelompok-node:hover{background:rgba(108,111,245,.15);border-color:var(--accent);color:var(--accent)}
.org-k-name{font-size:.78rem;font-weight:700}
.org-k-meta{font-size:.6rem;color:var(--muted);margin-top:3px;font-family:var(--mono)}
/* modal anggota list */
.modal-member-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.modal-member-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;border:1px solid var(--bd);background:var(--card);cursor:pointer;transition:border-color .15s}
.modal-member-row:hover{border-color:var(--accent)}
.modal-member-av{width:28px;height:28px;border-radius:50%;background:rgba(108,111,245,.15);border:1px solid rgba(108,111,245,.3);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;color:var(--accent);flex-shrink:0}
.modal-member-info{flex:1;min-width:0}
.modal-member-name{font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.modal-member-role{font-size:.62rem;color:var(--dim)}
.modal-member-tasks{font-size:.6rem;font-family:var(--mono);color:var(--dim);flex-shrink:0;display:flex;gap:6px;align-items:center}
/* sidebar indent */
.kelompok-children{padding-left:14px;border-left:1px solid var(--bd);margin-left:14px;margin-bottom:4px;transition:border-color .25s}
/* order btns */
.grp-order-btn{width:14px;height:14px;border-radius:2px;border:none;background:transparent;color:var(--dim);font-size:.55rem;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;flex-shrink:0}
.grp-order-btn:hover{color:var(--text)}
.task-add-btn-row{flex-shrink:0;padding:8px 14px;border-bottom:1px solid var(--bd);transition:border-color .25s}
.task-add-inline-btn{font-size:.72rem;font-weight:600;padding:5px 12px;border-radius:6px;border:1px dashed var(--bd);background:transparent;color:var(--muted);width:100%;text-align:left;transition:all .15s;display:flex;align-items:center;gap:6px}
.task-add-inline-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Section header inside task area */
.task-section{margin-bottom:4px}
.task-section-header{display:flex;align-items:center;gap:8px;padding:10px 2px 5px;border-bottom:1px solid var(--bd);margin-bottom:4px;transition:border-color .25s}
.task-section-ico{font-size:.85rem}
.task-section-label{font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.task-section-count{font-size:.6rem;font-family:var(--mono);color:var(--dim);background:var(--card);padding:1px 7px;border-radius:8px;border:1px solid var(--bd)}

/* Task card */
.task-card{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:8px;border:1px solid var(--bd);
  background:var(--card);margin-bottom:6px;
  transition:border-color .15s,background .25s;
  position:relative;
}
.task-card:hover{border-color:var(--accent)}
.task-left-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:24px}
.task-recurring-bar{background:var(--accent)}
.task-once-bar{background:var(--gold)}
.task-body{flex:1;min-width:0}
.task-title{font-size:.82rem;font-weight:600;line-height:1.45;word-break:break-word}
.task-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
.task-type-badge{font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase;border:1px solid}
.badge-recurring{background:rgba(108,111,245,.12);border-color:rgba(108,111,245,.3);color:var(--accent)}
.badge-once{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:var(--gold)}
.task-recur-detail{font-size:.62rem;color:var(--muted);font-family:var(--mono)}
.task-notes{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.55;transition:color .25s;white-space:pre-wrap}
.task-person-chip{font-size:.6rem;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--surface);border:1px solid var(--bd);color:var(--muted);white-space:nowrap}
.task-card-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0}
.task-card:hover .task-card-actions{opacity:1}
.tc-act{width:22px;height:22px;border-radius:4px;border:none;background:transparent;color:var(--dim);font-size:.7rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tc-act:hover{background:var(--surface);color:var(--text)}
.tc-act.del:hover{background:rgba(248,113,113,.1);color:var(--red)}

/* All view group header */
.group-header{display:flex;align-items:center;gap:8px;padding:10px 2px 5px;border-bottom:1px solid var(--bd);margin:10px 0 6px;transition:border-color .25s}
.group-header:first-child{margin-top:0}
.group-avatar{width:22px;height:22px;border-radius:50%;background:rgba(108,111,245,.18);border:1px solid rgba(108,111,245,.3);display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:700;color:var(--accent)}
.group-name{font-size:.74rem;font-weight:700;flex:1;display:inline-flex;align-items:center;gap:3px}
.group-role{font-size:.62rem;color:var(--dim)}
.group-count{font-size:.6rem;font-family:var(--mono);color:var(--dim);background:var(--card);padding:1px 7px;border-radius:8px;border:1px solid var(--bd)}
.group-empty{font-size:.72rem;color:var(--dim);padding:6px 2px 10px}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

.bell-btn{position:relative;background:none;border:none;font-size:1.1rem;padding:4px 6px;cursor:pointer;color:var(--muted);transition:color .15s}
.bell-btn:hover{color:var(--text)}
.bell-badge{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:.55rem;font-weight:700;border-radius:50%;width:14px;height:14px;align-items:center;justify-content:center;line-height:1}

.info-event-card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:8px;transition:border-color .15s}
.info-event-card:hover{border-color:var(--accent)}
.info-event-title{font-weight:700;font-size:.88rem;margin-bottom:4px}
.info-event-meta{font-size:.72rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.info-event-badge{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid transparent}
.info-today{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3);color:var(--green)}
.info-soon{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:var(--gold)}
.info-recur{background:rgba(108,111,245,.12);border-color:rgba(108,111,245,.3);color:var(--accent)}
.info-past{background:rgba(92,92,122,.12);border-color:rgba(92,92,122,.3);color:var(--dim)}

.settings-card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 18px 18px;margin-bottom:14px;max-width:640px}
.settings-section{margin-bottom:0}
.settings-section-title{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:14px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--bd)}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:.82rem;font-weight:600}
.settings-row-desc{font-size:.7rem;color:var(--muted);margin-top:2px}
.toggle-wrap{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle-inp{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;border-radius:11px;background:var(--bd);cursor:pointer;transition:background .2s}
.toggle-inp:checked+.toggle-track{background:var(--accent)}
.toggle-track::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle-inp:checked+.toggle-track::after{transform:translateX(18px)}

@media(max-width:640px){
  .sidebar{width:100%!important;height:210px;flex-shrink:0;border-right:none;border-top:1px solid var(--bd);order:2}
  .app{flex-direction:column}
  .main{order:1}
}

/* ── Project Access visibility ── */
.project-access{display:none!important}
body.is-admin .project-access, body.is-viewer .project-access{display:flex!important}

/* ── Gate password toggle ── */
.pw-wrap{position:relative;width:100%;margin-bottom:10px}
.pw-wrap .gate-input{margin-bottom:0;padding-right:38px}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:2px 4px;transition:color .15s}
.pw-toggle:hover{color:var(--text)}

/* ── Gate mode tabs ── */
.gate-mode-tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--card);border-radius:8px;padding:3px}
.gate-mode-tab{flex:1;padding:6px;border:none;border-radius:6px;background:transparent;color:var(--muted);font-size:.72rem;font-weight:600;cursor:pointer;transition:all .15s}
.gate-mode-tab.active{background:var(--accent);color:#fff}
.gate-name-input{width:100%;padding:8px 14px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--text);font-size:.88rem;text-align:center;outline:none;transition:border-color .15s;margin-bottom:8px}
.gate-name-input:focus{border-color:var(--accent)}

/* ── Project view ── */
.proj-card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin-bottom:10px;transition:border-color .15s}
.proj-card:hover{border-color:var(--accent)}
.proj-card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;cursor:pointer;user-select:none}
.proj-chevron{flex-shrink:0;font-size:.65rem;color:var(--muted);margin-top:4px;transition:transform .2s}
.proj-chevron.open{transform:rotate(90deg)}
.proj-collapse{display:none}
.proj-collapse.open{display:block}
.proj-title{font-size:.9rem;font-weight:800;flex:1}
.proj-client{font-size:.7rem;color:var(--muted);margin-bottom:4px}
.proj-meta{display:flex;gap:10px;font-size:.68rem;color:var(--dim);flex-wrap:wrap;margin-bottom:10px}
.proj-badge{padding:2px 8px;border-radius:4px;font-size:.62rem;font-weight:700;border:1px solid}
.proj-badge-active{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:var(--green)}
.proj-badge-done{background:rgba(148,148,184,.08);border-color:var(--bd);color:var(--dim)}
.proj-badge-late{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:var(--red)}
.proj-actions{display:flex;gap:6px;flex-shrink:0}

/* ── Project timeline ── */
.proj-timeline-wrap{margin:10px 0 4px}
.proj-timeline-label{display:flex;justify-content:space-between;font-size:.6rem;color:var(--dim);margin-bottom:4px}
.proj-timeline-bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;display:flex;position:relative}
.proj-tl-optimistic{height:100%;background:var(--green);border-radius:4px 0 0 4px}
.proj-tl-buffer{height:100%;background:var(--gold);border-radius:0 4px 4px 0}

/* ── Project member rows ── */
.proj-member-section{margin-top:12px;border-top:1px solid var(--bd);padding-top:12px}
.proj-member-row{margin-bottom:14px}
.proj-member-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.proj-member-avatar{width:26px;height:26px;border-radius:50%;background:rgba(108,111,245,.15);border:1px solid rgba(108,111,245,.3);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--accent);flex-shrink:0}
.proj-member-name{font-size:.78rem;font-weight:600;flex:1;display:inline-flex;align-items:center;gap:3px}
.proj-member-role{font-size:.62rem;color:var(--muted)}
.proj-member-tl{height:6px;border-radius:3px;background:rgba(108,111,245,.25);margin:5px 0 8px;position:relative;overflow:hidden}
.proj-member-tl-bar{height:100%;border-radius:3px;background:var(--accent);position:absolute}
.proj-task-list{display:flex;flex-direction:column;gap:4px;padding-left:34px}
.proj-task-item{display:flex;align-items:center;gap:8px;font-size:.75rem;padding:4px 8px;border-radius:5px;background:var(--surface);border:1px solid transparent;transition:border-color .15s}
.proj-task-item:hover{border-color:var(--bd)}
.proj-task-item.done{opacity:.55}
.proj-task-cb{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--bd);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;transition:all .15s}
.proj-task-cb.checked{background:var(--green);border-color:var(--green);color:#fff}
.proj-task-text{flex:1;line-height:1.4;white-space:pre-wrap}
.proj-task-item.done .proj-task-text{text-decoration:line-through;color:var(--dim)}
.proj-task-due{font-size:.6rem;color:var(--dim);white-space:nowrap;font-family:var(--mono)}
.proj-task-acts{display:none;gap:3px}
.proj-task-item:hover .proj-task-acts{display:flex}
.proj-task-item:hover .proj-task-due{display:none}
.proj-add-btn{font-size:.68rem;font-weight:600;padding:3px 10px;border-radius:5px;border:1px dashed var(--bd);background:transparent;color:var(--muted);cursor:pointer;margin-left:34px;margin-top:4px;transition:all .15s;display:block}
.proj-add-btn:hover{border-color:var(--accent);color:var(--accent)}
.proj-progress{height:4px;border-radius:2px;background:var(--bd);margin-top:4px;overflow:hidden}
.proj-progress-bar{height:100%;border-radius:2px;background:var(--accent);transition:width .3s}

/* ── Culture timeline ── */
.culture-timeline{position:relative;padding:24px 40px 48px;max-width:680px;margin:0 auto}
.culture-timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bd);transform:translateX(-50%)}
.culture-timeline-item{position:relative;display:flex;align-items:flex-start;margin-bottom:24px}
.culture-timeline-item.tl-left{flex-direction:row}
.culture-timeline-item.tl-right{flex-direction:row-reverse}
.culture-tl-card{width:calc(50% - 26px);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;transition:border-color .15s}
.culture-tl-card:hover{border-color:var(--accent)}
.culture-timeline-item.tl-left .culture-tl-card{text-align:right;margin-right:auto}
.culture-timeline-item.tl-right .culture-tl-card{text-align:left;margin-left:auto}
.culture-tl-dot{position:absolute;left:50%;transform:translateX(-50%);top:14px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);z-index:1}
.culture-tl-date{font-size:.6rem;color:var(--muted);font-weight:600;letter-spacing:.04em;margin-bottom:3px}
.culture-tl-title{font-size:.87rem;font-weight:700;margin-bottom:3px;color:var(--text)}
.culture-tl-desc{font-size:.73rem;color:var(--muted);line-height:1.5;white-space:pre-wrap;margin-top:4px}
.culture-tl-badge{display:inline-flex;align-items:center;font-size:.57rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:10px;margin-bottom:5px}
.culture-tl-badge.internal{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.culture-tl-badge.eksternal{background:rgba(251,191,36,.12);color:var(--gold,#fbbf24);border:1px solid rgba(251,191,36,.3)}
.culture-tl-badge.kolaborasi{background:rgba(108,111,245,.1);color:var(--accent);border:1px solid rgba(108,111,245,.25)}
.culture-tl-acts{display:none;gap:4px;margin-top:7px}
.culture-timeline-item.tl-left .culture-tl-acts{justify-content:flex-end}
.culture-timeline-item.tl-right .culture-tl-acts{justify-content:flex-start}
.culture-tl-card:hover .culture-tl-acts{display:flex}
.fab-culture{position:fixed;bottom:24px;right:24px;z-index:200;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.4rem;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(108,111,245,.45);transition:transform .15s,box-shadow .15s}
.fab-culture:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(108,111,245,.6)}
/* ── Notulensi ── */
.notul-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.notul-toolbar-title{font-size:.82rem;font-weight:800;flex:1;color:var(--text)}
/* Topik card */
.notul-topik{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .2s,background .2s}
.notul-topik:hover{border-color:var(--accent)}
.notul-topik-head{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;min-width:0}
.notul-topik-icon{width:30px;height:30px;border-radius:7px;background:rgba(108,111,245,.12);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.notul-topik-info{flex:1;min-width:0}
.notul-topik-title{font-size:.86rem;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notul-topik-meta{font-size:.62rem;color:var(--muted);margin-top:1px}
.notul-topik-acts{display:flex;gap:3px;flex-shrink:0;opacity:0;transition:opacity .15s}
.notul-topik-head:hover .notul-topik-acts{opacity:1}
.notul-chevron{font-size:.6rem;color:var(--dim);flex-shrink:0;transition:transform .2s;display:inline-block;margin-left:2px}
.notul-topik.open .notul-chevron{transform:rotate(180deg)}
.notul-topik-body{display:none;border-top:1px solid var(--bd)}
.notul-topik.open .notul-topik-body{display:block}
.notul-topik-desc{padding:8px 14px 4px;font-size:.74rem;color:var(--muted);line-height:1.5}
.notul-topik-add-btn{display:flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;color:var(--accent);background:transparent;border:1px dashed rgba(108,111,245,.4);border-radius:6px;padding:5px 12px;cursor:pointer;margin:8px 14px 10px;transition:background .15s,border-color .15s;width:calc(100% - 28px)}
.notul-topik-add-btn:hover{background:rgba(108,111,245,.08);border-color:var(--accent)}
/* Sesi rapat */
.notul-sesi-list{display:flex;flex-direction:column}
.notul-sesi{border-top:1px solid var(--bd);transition:background .1s}
.notul-sesi-head{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;user-select:none}
.notul-sesi-head:hover{background:rgba(108,111,245,.05)}
.notul-date-badge{font-size:.6rem;font-weight:700;color:var(--accent);background:rgba(108,111,245,.1);border:1px solid rgba(108,111,245,.2);border-radius:5px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.notul-sesi-loc{flex:1;font-size:.75rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notul-sesi-acts{display:flex;gap:3px;flex-shrink:0;opacity:0;transition:opacity .15s}
.notul-sesi-head:hover .notul-sesi-acts{opacity:1}
.notul-sesi-chevron{font-size:.55rem;color:var(--dim);flex-shrink:0;transition:transform .2s}
.notul-sesi.open .notul-sesi-chevron{transform:rotate(180deg)}
.notul-sesi-body{display:none;padding:6px 14px 12px;background:var(--surface);border-top:1px solid var(--bd)}

  wrap.style.cssText='position:relative';
  wrap.innerHTML=`<input class="form-input" id="${id}-q" type="text" value="${selMem?esc(selMem.name):''}" placeholder="${esc(ph)}" autocomplete="off" spellcheck="false"/><input type="hidden" id="${id}" value="${esc(currentId||'')}"/><div id="${id}-list" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:400;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-top:2px;max-height:200px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.25)"></div>`;

  const hInp=wrap.querySelector(`#${id}`);

    const ql=q.toLowerCase();

        qInp.value=m.id?m.name:'';
        list.style.display='none';
      });
      list.appendChild(d);
    });
    list.style.display=rows.length?'':'none';
  }

/* ── Tim & anggota tim ────────────────────────────────────────────
   Setiap lomba punya SALINAN tim sendiri (tidak shared), jadi mengubah
   anggota tim di satu lomba TIDAK memengaruhi lomba lain.
   Bentuk data lama: l.tim = "Nama Tim" (string) → dinormalisasi jadi object. */
function normTim(t){
  if(t==null) return null;
  if(typeof t==='string'){ const n=t.trim(); return n?{name:n,members:[]}:null; }
  const name=String(t.name||'').trim();
  const members=(Array.isArray(t.members)?t.members:[])
    .filter(m=>m&&!m.deleted)
    .map(m=>({
      id:m.id||uid(),
      name:String(m.name||'').trim(),
      peran:m.peran==='ketua'?'ketua':'anggota',
      nim:String(m.nim||'').trim()
    }));
  if(!name&&!members.length) return null;
  return {name,members};
}
function timMembers(t){ return (t&&Array.isArray(t.members))?t.members:[]; }
function normLombasTim(lombas){ (lombas||[]).forEach(l=>{ if('tim' in l) l.tim=normTim(l.tim); }); }

/* ── Daftar tim master (template) ────────────────────────────────
   Tim master dibuat admin lewat tombol "👥 Kelola Tim".
   Lomba yang memakai tim ini menyimpan SALINAN anggota, jadi mengubah
   tim master TIDAK mengubah lomba yang sudah memakai tim tersebut. */
function normTimLomba(t){
  if(!t) return null;
  const name=String(t.name||'').trim();
  if(!name) return null;
  const out={
    id:t.id||uid(),
    name,
    members:timMembers(t).map(m=>({
      id:m.id||uid(),
      name:String(m.name||'').trim(),
      peran:m.peran==='ketua'?'ketua':'anggota',
      nim:String(m.nim||'').trim()
    })),
    createdAt:t.createdAt||0,
    updatedAt:t.updatedAt||0
  };
  if(t.deleted) out.deleted=true;   /* soft delete harus tetap tersimpan */
  return out;
}
function mergeTimLombaClient(a=[],b=[]){
  const map=new Map();
  for(const t of a) map.set(t.id,t);
  for(const t of b){ const ex=map.get(t.id); if(!ex||(t.updatedAt||0)>=(ex.updatedAt||0)) map.set(t.id,t); }
  const bIds=new Set(b.map(x=>x.id));
  return [...b.map(x=>map.get(x.id)).filter(Boolean),...[...map.values()].filter(x=>!bIds.has(x.id))];
}

/* ── Daftar jenis master's ── */
function normJenis(j){
  if(!j) return null;
  const name=String(j.name||'').trim();
  if(!name) return null;
  const out={id:j.id||uid(),name,createdAt:j.createdAt||0,updatedAt:j.updatedAt||0};
  if(j.deleted) out.deleted=true;
  return out;
}
function mergeArrClient(a=[],b=[]){
  const map=new Map();
  for(const x of a) map.set(x.id,x);
  for(const x of b){ const ex=map.get(x.id); if(!ex||(x.updatedAt||0)>=(ex.updatedAt||0)) map.set(x.id,x); }
  const bIds=new Set(b.map(x=>x.id));
  return [...b.map(x=>map.get(x.id)).filter(Boolean),...[...map.values()].filter(x=>!bIds.has(x.id))];
}

function migrate(d){
  d.kelompoks=d.kelompoks.map((k,i)=>Object.assign({parentId:null,order:i,updatedAt:0,joinable:true,jumlah:null},k));
  if(!d.orgName) d.orgName='Alteco';
  if(!d.assets) d.assets=[];
  if(!d.events) d.events=[];
  if(!d.projects) d.projects=[];
  if(!d.cultures) d.cultures=[];
  if(!d.notulensi) d.notulensi=[];
  if(!d.notulensiTopik) d.notulensiTopik=[];
  if(!d.broadcastProduk) d.broadcastProduk=[];
  if(!d.lombas) d.lombas=[];
  if(!d.timLomba) d.timLomba=[];
  if(!d.jenisLomba) d.jenisLomba=[];
  d.timLomba=d.timLomba.map(normTimLomba).filter(Boolean);
  d.jenisLomba=d.jenisLomba.map(normJenis).filter(Boolean);
  normLombasTim(d.lombas);
  if(!d.bahanPers) d.bahanPers=[];
  if(!d.ruangan) d.ruangan=[];
  if(!d.settings) d.settings={pushNotifEnabled:false,notifTime:'07:00',notifDaysBefore:1};
  if(!d.settings.notifTime) d.settings.notifTime='07:00';
  if(d.settings.notifDaysBefore==null) d.settings.notifDaysBefore=1;
  if(!d.settings.writePat) d.settings.writePat='';
  if(d.settings.projectKode==null) d.settings.projectKode='';
  if(d.settings.broadcastKode==null) d.settings.broadcastKode='';
  /* migrate komunitas → regulasi */
  if(d.komunitas&&!d.regulasi) d.regulasi=d.komunitas;
  if(!d.regulasi) d.regulasi={visi:'',misi:'',syaratAnggota:[],syaratTim:[],sanksi:[]};
  if(!d.regulasi.syaratAnggota) d.regulasi.syaratAnggota=d.regulasi.syaratMember||[];
  if(!d.regulasi.syaratTim) d.regulasi.syaratTim=[];
  if(!d.regulasi.sanksi) d.regulasi.sanksi=[];
  if(!d.regulasi.keuntungan) d.regulasi.keuntungan=[];
  delete d.regulasi.syaratMember;
  if(d.regulasi.syaratAnggota) d.regulasi.syaratAnggota=d.regulasi.syaratAnggota.map(s=>Object.assign({updatedAt:0},s));
  if(d.regulasi.syaratTim) d.regulasi.syaratTim=d.regulasi.syaratTim.map(s=>Object.assign({updatedAt:0},s));
  if(d.regulasi.sanksi) d.regulasi.sanksi=d.regulasi.sanksi.map(s=>Object.assign({updatedAt:0},s));
  if(d.regulasi.keuntungan) d.regulasi.keuntungan=d.regulasi.keuntungan.map(s=>{
    const base=Object.assign({updatedAt:0,kelompoks:[]},s);
    if(base.kelompok&&!base.kelompoks.length) base.kelompoks=[base.kelompok];
    delete base.kelompok;
    return base;
  });
  if(d.tasks) d.tasks=d.tasks.map(t=>Object.assign({updatedAt:0},t));
  if(d.members) d.members=d.members.map(m=>Object.assign({updatedAt:0},m));
  if(d.assets) d.assets=d.assets.map(a=>Object.assign({updatedAt:0},a));
  if(d.cultures) d.cultures=d.cultures.map(c=>Object.assign({updatedAt:0},c));
  if(d.events) d.events=d.events.map(ev=>Object.assign({notifSentDate:null,updatedAt:0},ev));
  if(d.projects) d.projects=d.projects.map(p=>Object.assign({updatedAt:0},p,{
    members:(p.members||[]).map(m=>Object.assign({updatedAt:0},m,{
      tasks:(m.tasks||[]).map(t=>Object.assign({updatedAt:0},t))
    }))
  }));
  return d;
}

/* client-side merge: newer updatedAt wins per item; ORDER follows local (b) so
   user reordering persists after refresh. Gist-only items appended at end. */
function mergeArrClient(a=[],b=[]){
  const map=new Map();
  for(const item of a) map.set(item.id,item);
  for(const item of b){
    const ex=map.get(item.id);
    if(!ex||(item.updatedAt||0)>=(ex.updatedAt||0)) map.set(item.id,item);
  }
  const bIds=new Set(b.map(x=>x.id));
  return [
    ...b.map(x=>map.get(x.id)).filter(Boolean),
    ...[...map.values()].filter(x=>!bIds.has(x.id)),
  ];
}
function mergeBcItemsClient(a=[],b=[]){
  const map=new Map();
  for(const t of a) map.set(t.id,t);
  for(const t of b){const ex=map.get(t.id);if(!ex||(t.updatedAt||0)>=(ex.updatedAt||0))map.set(t.id,t);}
  return [...map.values()];
}
function mergeBcKondisiClient(a=[],b=[]){
  const aMap=new Map(a.map(k=>[k.id,k]));
  const bMap=new Map(b.map(k=>[k.id,k]));
  const ids=new Set([...aMap.keys(),...bMap.keys()]);
  return [...ids].map(id=>{
    const ai=aMap.get(id),bi=bMap.get(id);
    if(!ai) return bi; if(!bi) return ai;
    const newer=(bi.updatedAt||0)>=(ai.updatedAt||0)?bi:ai;
    return {...ai,...newer,items:mergeBcItemsClient(ai.items||[],bi.items||[])};
  });
}
function mergeBcProdukClient(a=[],b=[]){
  const aMap=new Map(a.map(p=>[p.id,p]));
  const bMap=new Map(b.map(p=>[p.id,p]));
  const bIds=new Set(b.map(x=>x.id));
  const all=new Set([...aMap.keys(),...bMap.keys()]);
  const merged=[...all].map(id=>{
    const ai=aMap.get(id),bi=bMap.get(id);
    if(!ai) return bi; if(!bi) return ai;
    const newer=(bi.updatedAt||0)>=(ai.updatedAt||0)?bi:ai;
    return {...ai,...newer,kondisi:mergeBcKondisiClient(ai.kondisi||[],bi.kondisi||[])};
  });
  return [...b.map(x=>merged.find(m=>m.id===x.id)).filter(Boolean),...merged.filter(x=>!bIds.has(x.id))];
}
function mergeLombaIdeClient(a=[],b=[]){
  const map=new Map();
  for(const t of a) map.set(t.id,t);
  for(const t of b){const ex=map.get(t.id);if(!ex||(t.updatedAt||0)>=(ex.updatedAt||0))map.set(t.id,t);}
  return [...map.values()];
}
function mergeLombasClient(a=[],b=[]){
  const aMap=new Map(a.map(l=>[l.id,l]));
  const bMap=new Map(b.map(l=>[l.id,l]));
  const bIds=new Set(b.map(x=>x.id));
  const all=new Set([...aMap.keys(),...bMap.keys()]);
  const merged=[...all].map(id=>{
    const ai=aMap.get(id),bi=bMap.get(id);
    if(!ai) return bi; if(!bi) return ai;
    const newer=(bi.updatedAt||0)>=(ai.updatedAt||0)?bi:ai;
    return {...ai,...newer,ide:mergeLombaIdeClient(ai.ide||[],bi.ide||[])};
  });
  return [...b.map(x=>merged.find(m=>m.id===x.id)).filter(Boolean),...merged.filter(x=>!bIds.has(x.id))];
}
function mergeRegulasisClient(gr={},br={}){
  const base={visi:'',misi:'',syaratAnggota:[],syaratTim:[],keuntungan:[],sanksi:[]};
  gr={...base,...gr}; br={...base,...br};
  return {
    visi:br.visi||gr.visi,
    misi:br.misi||gr.misi,
    syaratAnggota:mergeArrClient(gr.syaratAnggota,br.syaratAnggota),
    syaratTim:mergeArrClient(gr.syaratTim,br.syaratTim),
    keuntungan:mergeArrClient(gr.keuntungan,br.keuntungan),
    sanksi:mergeArrClient(gr.sanksi,br.sanksi),
  };
}
function mergeDbOnLoad(gist,local){
  return {
    ...gist,
    kelompoks: mergeArrClient(gist.kelompoks||[],local.kelompoks||[]),
    members:   mergeArrClient(gist.members||[],  local.members||[]),
    tasks:     mergeArrClient(gist.tasks||[],    local.tasks||[]),
    assets:    mergeArrClient(gist.assets||[],   local.assets||[]),
    events:    mergeArrClient(gist.events||[],   local.events||[]),
    cultures:        mergeArrClient(gist.cultures||[],        local.cultures||[]),
    notulensi:       mergeArrClient(gist.notulensi||[],       local.notulensi||[]),
    notulensiTopik:  mergeArrClient(gist.notulensiTopik||[],  local.notulensiTopik||[]),
    broadcastProduk: mergeBcProdukClient(gist.broadcastProduk||[],local.broadcastProduk||[]),
    lombas:    mergeLombasClient(gist.lombas||[],local.lombas||[]),
    timLomba:  mergeTimLombaClient(gist.timLomba||[],local.timLomba||[]),
    jenisLomba: mergeArrClient(gist.jenisLomba||[],local.jenisLomba||[]),
    bahanPers: mergeArrClient(gist.bahanPers||[],local.bahanPers||[]),
    ruangan:   mergeArrClient(gist.ruangan||[],local.ruangan||[]),
    regulasi:   mergeRegulasisClient(gist.regulasi||{},local.regulasi||{}),
    settings:  local.settings||gist.settings,
    orgName:   local.orgName||gist.orgName,
  };
}

async function gistLoad(){
  const r=await fetch(`https://api.github.com/gists/${GIST_ID}`,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok) throw new Error('gist fetch '+r.status);
  const gist=await r.json();
  const content=gist.files[GIST_FILE]?.content;
  if(!content) return null;
  const d=JSON.parse(content);
  if(d&&d.kelompoks&&d.members&&d.tasks) return migrate(d);
  return null;
}

async function syncFromGist(renderFn){
  const btn=document.getElementById('syncBtn');
  if(btn){ btn.textContent='↻'; btn.style.opacity='.4'; btn.disabled=true; }
  try{
    const remote=await gistLoad();
    if(remote){
      db=mergeDbOnLoad(remote,db);
      localStorage.setItem(LS_KEY,JSON.stringify(db));
      (renderFn||getCurrentViewRender())();
    }
  }catch(e){ /* silent */ }
  finally{
    if(btn){ btn.textContent='↻'; btn.style.opacity=''; btn.disabled=false; }
  }
}

let _saveTimer=null;

  if(!WORKER_URL) return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>_doSave(),300);
}
async function _doSave(){
  try{
    await fetch(WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(db)
    });
  }catch(e){ console.warn('Save failed',e); }
}
/* flush on page unload — sendBeacon survives navigation */
window.addEventListener('beforeunload',()=>{
  if(!WORKER_URL) return;
  clearTimeout(_saveTimer);
  navigator.sendBeacon(WORKER_URL,new Blob([JSON.stringify(db)],{type:'application/json'}));
});

  }catch(e){
    console.warn('Gist load failed, using local',e);
    db=local||{kelompoks:[],members:[],tasks:[],assets:[],orgName:'Alteco',events:[],timLomba:[],jenisLomba:[],settings:{pushNotifEnabled:false,notifTime:'07:00'}};
  }
  overlay.style.opacity='0';
  setTimeout(()=>overlay.style.display='none',300);

  /* Update gate org name */
  document.getElementById('gateOrg').textContent=db.orgName||'Alteco';

  const gate=document.getElementById('gate');
  const inp=document.getElementById('gateInput');
  const btn=document.getElementById('gateBtn');
  const err=document.getElementById('gateErr');

  /* Restore session */
  const stored=sessionStorage.getItem('rak_alteco_role');
  if(stored==='admin'||stored==='viewer'){
    role=stored;
    try{
      const ps=sessionStorage.getItem('alteco_proj_session');
      if(ps) projSession=JSON.parse(ps);
    }catch{}
    try{
      if(sessionStorage.getItem('alteco_bc_session')==='1') bcSession=true;
    }catch{}
    gate.classList.add('hidden'); applyRole(); return;
  }

  /* Password toggle — staff */
  document.getElementById('gatePwToggle').addEventListener('click',()=>{
    inp.type=inp.type==='password'?'text':'password';
  });

  /* Staff login */
  function attempt(){
    const val=inp.value.trim();
    if(val===PASS_ADMIN){
      role='admin'; sessionStorage.setItem('rak_alteco_role','admin');
      gate.classList.add('hidden'); applyRole();
    }
    else if(val===PASS_VIEW){
      role='viewer'; sessionStorage.setItem('rak_alteco_role','viewer');
      gate.classList.add('hidden'); applyRole();
    }
    else {
      inp.classList.add('error'); err.textContent='Kode akses tidak valid.'; inp.value='';
      setTimeout(()=>{inp.classList.remove('error');err.textContent=''},1500);
    }
  }
  btn.addEventListener('click',attempt);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')attempt()});

  inp.focus();
})();

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) }
function initials(n){ return n.trim().split(/\s+/).slice(0,2).map(w=>w[0].toUpperCase()).join('') }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function memberTasks(mid){ return db.tasks.filter(t=>t.memberId===mid&&!t.deleted) }
function kelompokName(did){ const d=db.kelompoks.find(x=>x.id===did&&!x.deleted); return d?d.name:'' }
function kelompokAllIds(id){ const ch=db.kelompoks.filter(k=>k.parentId===id&&!k.deleted); return [id,...ch.flatMap(c=>kelompokAllIds(c.id))]; }
function recurrenceLabel(r){
  const map={harian:'Harian',mingguan:'Mingguan',bulanan:'Bulanan',tahunan:'Tahunan'};
  return map[r]||r||'';
}
function fmtDueDate(d){
  if(!d) return '';
  return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}

/* ══════════════════════════════════════════
   SIDEBAR RENDER
══════════════════════════════════════════ */
function kelompokChildren(parentId){
  return db.kelompoks
    .filter(k=>(k.parentId||null)===parentId&&!k.deleted)
    .sort((a,b)=>a.order-b.order);
}

function renderSidebar(){
  const allItem=document.getElementById('allItem');
  allItem.className='all-item'+(activeId===ALL?' active':'');
  document.getElementById('allCount').textContent=db.tasks.filter(t=>!t.deleted).length||'';

  const scroll=document.getElementById('peopleScroll');
  scroll.innerHTML='';

  /* auto-expand kelompok of active member */
  if(activeId && activeId!==ALL){
    const activeMember=db.members.find(m=>m.id===activeId);
    if(activeMember?.kelompokId) expandedKelompoks.add(activeMember.kelompokId);
  }

  /* Recursive render */
  function renderKelompokGroup(parentId, container){
    kelompokChildren(parentId).forEach(k=>{
      const block=document.createElement('div');
      block.className='kelompok-block';

      const expanded=expandedKelompoks.has(k.id);
      const siblings=kelompokChildren(k.parentId||null);
      const idx=siblings.findIndex(s=>s.id===k.id);
      const isJoinable=k.joinable!==false;

      const memberCount=isJoinable?db.members.filter(m=>m.kelompokId===k.id&&!m.deleted).length:0;
      const hdr=document.createElement('div');
      hdr.className='kelompok-label';
      hdr.innerHTML=`
        ${memberCount?`<span class="kelompok-chevron" style="transform:rotate(${expanded?90:0}deg);cursor:pointer" data-toggle-grp="${k.id}">▶</span>`:''}
        <span class="kelompok-name-text">${esc(k.name)}</span>
        ${!isJoinable?`<span style="font-size:.75rem;color:var(--dim);margin-left:4px">(${k.jumlah??0})</span>`:''}
        ${role==='admin'?`<span class="grp-actions">
          ${idx>0?`<button class="grp-order-btn" data-grp-up="${k.id}" title="Naik">▲</button>`:''}
          ${idx<siblings.length-1?`<button class="grp-order-btn" data-grp-dn="${k.id}" title="Turun">▼</button>`:''}
          <button class="grp-act-btn" data-grp-edit="${k.id}" title="Edit">✎</button>
          <button class="grp-act-btn del" data-grp-del="${k.id}" title="Hapus">✕</button>
          ${isJoinable?`<button class="grp-act-btn" data-grp-add-mem="${k.id}" title="+ Anggota" style="color:var(--accent)">+</button>`:''}
        </span>`:''}
      `;

      /* collapsible members only for joinable */
      const membersBody=document.createElement('div');
      membersBody.className='kelompok-body';
      membersBody.style.display=expanded?'':'none';
      if(isJoinable) db.members.filter(m=>m.kelompokId===k.id&&!m.deleted).sort((a,b)=>a.name.localeCompare(b.name,'id')).forEach(m=>membersBody.appendChild(makeMemberItem(m)));

      /* toggle on chevron click */
      hdr.querySelector('[data-toggle-grp]')?.addEventListener('click',e=>{
        e.stopPropagation();
        if(expandedKelompoks.has(k.id)) expandedKelompoks.delete(k.id);
        else expandedKelompoks.add(k.id);
        renderSidebar();
      });

      /* child kelompoks always visible */
      const childList=kelompokChildren(k.id);
      if(childList.length){
        const childWrap=document.createElement('div');
        childWrap.className='kelompok-children';
        renderKelompokGroup(k.id, childWrap);
        block.appendChild(hdr);
        block.appendChild(membersBody);
        block.appendChild(childWrap);
        container.appendChild(block);
        return;
      }

      block.appendChild(hdr);
      block.appendChild(membersBody);
      container.appendChild(block);
    });
  }

  renderKelompokGroup(null, scroll);

  /* No-kelompok members */
  const noGrpMembers=db.members.filter(m=>!m.deleted&&(!m.kelompokId||!db.kelompoks.find(d=>d.id===m.kelompokId&&!d.deleted)));
  if(noGrpMembers.length){
    const NO_GRP='__no_grp__';
    const expandedNG=expandedKelompoks.has(NO_GRP);
    const block=document.createElement('div');
    block.className='kelompok-block';
    const hdr=document.createElement('div');
    hdr.className='kelompok-label';
    hdr.innerHTML=`<span class="kelompok-chevron" style="transform:rotate(${expandedNG?90:0}deg)">▶</span><span class="kelompok-name-text" style="color:var(--dim)">Tanpa Kelompok</span>`;
    const body=document.createElement('div');
    body.className='kelompok-body';
    body.style.display=expandedNG?'':'none';
    noGrpMembers.sort((a,b)=>a.name.localeCompare(b.name,'id')).forEach(m=>body.appendChild(makeMemberItem(m)));
    hdr.addEventListener('click',()=>{
      if(expandedKelompoks.has(NO_GRP)) expandedKelompoks.delete(NO_GRP);
      else expandedKelompoks.add(NO_GRP);
      renderSidebar();
    });
    block.appendChild(hdr);
    block.appendChild(body);
    scroll.appendChild(block);
  }

  /* Bind actions */
  scroll.querySelectorAll('[data-grp-up]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k=db.kelompoks.find(x=>x.id===b.dataset.grpUp);
    if(!k) return;
    const siblings=kelompokChildren(k.parentId||null);
    const i=siblings.findIndex(s=>s.id===k.id);
    if(i>0){ const tmp=siblings[i-1].order; siblings[i-1].order=k.order; k.order=tmp; touch(siblings[i-1]); touch(k); }
    save(); renderSidebar();
  }));
  scroll.querySelectorAll('[data-grp-dn]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k=db.kelompoks.find(x=>x.id===b.dataset.grpDn);
    if(!k) return;
    const siblings=kelompokChildren(k.parentId||null);
    const i=siblings.findIndex(s=>s.id===k.id);
    if(i<siblings.length-1){ const tmp=siblings[i+1].order; siblings[i+1].order=k.order; k.order=tmp; touch(siblings[i+1]); touch(k); }
    save(); renderSidebar();
  }));
  scroll.querySelectorAll('[data-grp-edit]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    openModal('grp-edit',{id:b.dataset.grpEdit});
  }));
  scroll.querySelectorAll('[data-grp-del]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    const k=db.kelompoks.find(d=>d.id===b.dataset.grpDel);
    if(!k) return;
    const allIds=kelompokAllIds(k.id);
    const memberIds=db.members.filter(m=>allIds.includes(m.kelompokId)&&!m.deleted).map(m=>m.id);
    const subCount=allIds.length-1;
    if(!confirm(`Hapus kelompok "${k.name}"? ${subCount?`${subCount} sub-kelompok dan `:''} ${memberIds.length} anggota beserta tugasnya ikut terhapus.`)) return;
    db.tasks.filter(t=>memberIds.includes(t.memberId)).forEach(t=>touch(Object.assign(t,{deleted:true})));
    db.members.filter(m=>allIds.includes(m.kelompokId)).forEach(m=>touch(Object.assign(m,{deleted:true})));
    db.kelompoks.filter(d=>allIds.includes(d.id)).forEach(d=>touch(Object.assign(d,{deleted:true})));
    if(memberIds.includes(activeId)) activeId=null;
    save(); renderSidebar(); if(viewMode==='org') renderOrgChart(); else renderMain();
  }));
  scroll.querySelectorAll('[data-grp-add-mem]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    openModal('mem-add',{kelompokId:b.dataset.grpAddMem});
  }));
}

function makeMemberItem(m){
  const count=memberTasks(m.id).length;
  const div=document.createElement('div');
  div.className='member-item'+(activeId===m.id?' active':'');
  div.innerHTML=`
    <div class="member-avatar">${initials(m.name)}</div>
    <div class="member-info">
      <div class="member-name">${esc(m.name)}${(m.fullName||m.angkatan)?`<span class="fn-info-btn" title="Lihat info lengkap">ⓘ</span>`:''}</div>
      ${m.role?`<div class="member-role">${esc(m.role)}</div>`:''}
    </div>
    <span class="member-task-count">${count||''}</span>
    ${role==='admin'?`<span class="member-actions">
      <button class="m-act-btn" data-mem-edit="${m.id}">✎</button>
      <button class="m-act-btn del" data-mem-del="${m.id}">✕</button>
    </span>`:''}
  `;
  if(m.fullName||m.angkatan){
    div.querySelector('.fn-info-btn').addEventListener('click',e=>{
      e.stopPropagation();
      showFullNamePopup(e.currentTarget, memberPopupText(m.fullName,m.angkatan));
    });
  }
  div.addEventListener('click',e=>{
    if(e.target.closest('.member-actions')) return;
    if(e.target.closest('.fn-info-btn')) return;
    select(m.id);
  });
  if(role==='admin'){
    div.querySelector(`[data-mem-edit="${m.id}"]`).addEventListener('click',e=>{
      e.stopPropagation();
      openModal('mem-edit',{id:m.id});
    });
    div.querySelector(`[data-mem-del="${m.id}"]`).addEventListener('click',e=>{
      e.stopPropagation();
      if(!confirm(`Hapus "${m.name}" dan semua tugasnya?`)) return;
      const dm=db.members.find(x=>x.id===m.id); if(dm) touch(Object.assign(dm,{deleted:true}));
      db.tasks.filter(t=>t.memberId===m.id).forEach(t=>touch(Object.assign(t,{deleted:true})));
      if(activeId===m.id) activeId=null;
      save(); renderSidebar(); if(viewMode==='org') renderOrgChart(); else renderMain();
    });
  }
  return div;
}

/* ══════════════════════════════════════════
   TASKS RENDER
══════════════════════════════════════════ */
function renderTasks(){
  const area=document.getElementById('taskArea');
  area.innerHTML='';
  const isAll=activeId===ALL;

  function applyFilter(arr){
    if(activeFilter==='recurring') return arr.filter(t=>t.type==='recurring');
    if(activeFilter==='once') return arr.filter(t=>t.type==='once');
    return arr;
  }

  if(isAll){
    /* build name-groups: distinct name → array of member objects, sorted alpha */
    const nameMap=new Map();
    db.members.filter(m=>!m.deleted).forEach(m=>{
      if(!nameMap.has(m.name)) nameMap.set(m.name,[]);
      nameMap.get(m.name).push(m);
    });
    let groups=[...nameMap.entries()]
      .sort((a,b)=>a[0].localeCompare(b[0],'id'))
      .map(([name,members])=>({name,members}));
    if(filterMemberName) groups=groups.filter(g=>g.name===filterMemberName);
    else if(memberSearchQuery) groups=groups.filter(g=>g.name.toLowerCase().includes(memberSearchQuery));

    groups.forEach(({name,members})=>{
      /* format: KelompokA (jabatan), KelompokB */
      const kelompokLabel=members.map(m=>{
        const kn=kelompokName(m.kelompokId);
        if(!kn) return m.role?`(${esc(m.role)})`:null;
        return m.role?`${esc(kn)} (${esc(m.role)})`:esc(kn);
      }).filter(Boolean).join(', ');

      if(filterMemberName){
        /* filtered by name: sub-section per kelompok */
        const totalFiltered=members.reduce((s,m)=>s+applyFilter(memberTasks(m.id)).length,0);
        const gFullName=members[0]?.fullName||null;
        const gAngkatan=members[0]?.angkatan||null;
        const memberProjs=showMemberProjects?db.projects.filter(p=>!p.deleted&&(p.members||[]).some(pm=>!pm.deleted&&pm.name.toLowerCase()===name.toLowerCase())):[];
        const gh=document.createElement('div');
        gh.className='group-header';
        gh.innerHTML=`
          <div style="display:flex;flex-direction:column;flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <div class="group-avatar">${initials(name)}</div>
              <span class="group-name">${esc(name)}${(gFullName||gAngkatan)?`<span class="fn-info-btn" title="Lihat info lengkap">ⓘ</span>`:''}</span>
              ${kelompokLabel?`<span class="group-role" style="color:var(--dim)">${kelompokLabel}</span>`:''}

        });
      } else {
        /* not filtered: header only, clickable → filter by name */
        const totalTasks=members.reduce((s,m)=>s+memberTasks(m.id).length,0);
        const gFullName2=members[0]?.fullName||null;
        const gAngkatan2=members[0]?.angkatan||null;
        const memberProjs2=showMemberProjects?db.projects.filter(p=>!p.deleted&&(p.members||[]).some(pm=>!pm.deleted&&pm.name.toLowerCase()===name.toLowerCase())):[];

        gh.style.cssText='cursor:pointer;transition:background .15s';
        gh.innerHTML=`
          <div style="display:flex;flex-direction:column;flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <div class="group-avatar">${initials(name)}</div>
              <span class="group-name">${esc(name)}${(gFullName2||gAngkatan2)?`<span class="fn-info-btn" title="Lihat info lengkap">ⓘ</span>`:''}</span>
              ${kelompokLabel?`<span class="group-role" style="color:var(--dim)">${kelompokLabel}</span>`:''}
              <span style="flex:1"></span>
              <span class="group-count" style="margin-right:4px">${totalTasks} tugas</span>
              <span style="font-size:.68rem;color:var(--accent);font-weight:600;padding:2px 8px;border:1px solid var(--accent);border-radius:4px;flex-shrink:0">Lihat →</span>
            </div>
            ${memberProjs2.length?`<div class="proj-badge-row">${memberProjs2.map(p=>`<span class="proj-badge">${esc(p.title)}</span>`).join('')}</div>`:''}
          </div>
        `;

          gh.querySelector('.fn-info-btn').addEventListener('click',e=>{
            e.stopPropagation();
            showFullNamePopup(e.currentTarget,memberPopupText(gFullName2,gAngkatan2));
          });
        }
        gh.addEventListener('mouseenter',()=>gh.style.background='var(--card)');
        gh.addEventListener('mouseleave',()=>gh.style.background='');
        gh.addEventListener('click',e=>{
          if(e.target.closest('.fn-info-btn')) return;
          filterMemberName=name; memberSearchQuery='';
          document.getElementById('memberSearchInput').value=name;
          activeFilter='all';
          document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.f==='all'));
          renderMain();
        });
        area.appendChild(gh);
      }

    if(!groups.length){
      area.innerHTML=`<div style="padding:32px;text-align:center;color:var(--dim);font-size:.78rem">Belum ada anggota.</div>`;
    }
  } else {
    const allTasks=memberTasks(activeId);
    const recurring=applyFilter(allTasks.filter(t=>t.type==='recurring'));
    const once=applyFilter(allTasks.filter(t=>t.type==='once'));

    /* Section: Berulang */
    if(activeFilter!=='once'){
      const sh=document.createElement('div');
      sh.className='task-section-header';
      sh.innerHTML=`<span class="task-section-ico">🔁</span><span class="task-section-label">Berulang</span><span class="task-section-count">${recurring.length}</span>`;
      area.appendChild(sh);
      if(!recurring.length){
        const e=document.createElement('div');
        e.style.cssText='font-size:.72rem;color:var(--dim);padding:8px 2px 12px';
        e.textContent='Belum ada tugas berulang.';
        area.appendChild(e);
      } else {
        recurring.forEach(t=>area.appendChild(makeTaskCard(t,true)));
      }
    }

    /* Section: Sekali */
    if(activeFilter!=='recurring'){
      const sh=document.createElement('div');
      sh.className='task-section-header';
      sh.style.marginTop='10px';
      sh.innerHTML=`<span class="task-section-ico">📌</span><span class="task-section-label">Sekali</span><span class="task-section-count">${once.length}</span>`;
      area.appendChild(sh);
      if(!once.length){
        const e=document.createElement('div');
        e.style.cssText='font-size:.72rem;color:var(--dim);padding:8px 2px 12px';
        e.textContent='Belum ada tugas sekali.';
        area.appendChild(e);
      } else {
        once.forEach(t=>area.appendChild(makeTaskCard(t,true)));
      }
    }
  }
}

function makeTaskCard(t, showActions){
  const div=document.createElement('div');
  div.className='task-card';
  const isRecurring=t.type==='recurring';
  div.innerHTML=`
    <div class="task-left-bar ${isRecurring?'task-recurring-bar':'task-once-bar'}"></div>
    <div class="task-body">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-badges">
        <span class="task-type-badge ${isRecurring?'badge-recurring':'badge-once'}">${isRecurring?'🔁 Berulang':'📌 Sekali'}</span>
        ${isRecurring&&t.recurrence?`<span class="task-recur-detail">${esc(recurrenceLabel(t.recurrence))}</span>`:''}
        ${!isRecurring&&t.dueDate?`<span class="task-recur-detail">📅 ${esc(fmtDueDate(t.dueDate))}</span>`:''}
      </div>
      ${t.notes?`<div class="task-notes">${esc(t.notes)}</div>`:''}
    </div>
    ${showActions&&role==='admin'?`<div class="task-card-actions">
      <button class="tc-act" title="Edit" data-task-edit="${t.id}">✎</button>
      <button class="tc-act del" title="Hapus" data-task-del="${t.id}">✕</button>
    </div>`:''}
  `;
  if(showActions&&role==='admin'){
    div.querySelector(`[data-task-edit="${t.id}"]`).addEventListener('click',()=>openModal('task-edit',{id:t.id}));
    div.querySelector(`[data-task-del="${t.id}"]`).addEventListener('click',()=>{
      if(!confirm('Hapus tugas ini?')) return;
      const dt=db.tasks.find(x=>x.id===t.id); if(dt) touch(Object.assign(dt,{deleted:true}));
      save(); renderSidebar(); renderTasks();
    });
  }
  return div;
}

function renderAssets(){
  const area=document.getElementById('assetArea');
  area.innerHTML='';

  /* toolbar */
  const toolbar=document.createElement('div');
  toolbar.className='asset-toolbar';
  toolbar.innerHTML=`<span class="asset-toolbar-title">Inventaris Aset</span>
    <input class="asset-search" id="assetSearchInp" placeholder="Cari nama aset…" autocomplete="off" style="max-width:200px"/>
    <select class="asset-cat-select" id="assetCatSel"><option value="">Semua Kategori</option></select>`;
  if(role==='admin'){
    const addBtn=document.createElement('button');
    addBtn.className='task-add-inline-btn';
    addBtn.textContent='＋ Tambah Aset';
    addBtn.addEventListener('click',()=>openModal('asset-add',{}));
    toolbar.appendChild(addBtn);
  }
  area.appendChild(toolbar);
  const searchInp=document.getElementById('assetSearchInp');
  const catSel=document.getElementById('assetCatSel');
  searchInp.value=assetSearch;
  searchInp.addEventListener('input',function(){ assetSearch=this.value.toLowerCase(); renderAssetTable(); });
  catSel.addEventListener('change',function(){ assetCatFilter=this.value; renderAssetTable(); });

  /* table wrapper */
  const wrap=document.createElement('div');
  wrap.id='assetTableWrap';
  area.appendChild(wrap);

  renderAssetTable();
}

function renderAssetTable(){
  const wrap=document.getElementById('assetTableWrap');
  if(!wrap) return;
  wrap.innerHTML='';

  /* update category options */
  const catSel=document.getElementById('assetCatSel');
  if(catSel){
    const cats=[...new Set(db.assets.filter(a=>!a.deleted).map(a=>a.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'id'));
    catSel.innerHTML=`<option value="">Semua Kategori</option>`+cats.map(c=>`<option value="${esc(c)}"${assetCatFilter===c?' selected':''}>${esc(c)}</option>`).join('');
  }

  /* filter */
  let assets=db.assets.filter(a=>!a.deleted).sort((a,b)=>a.name.localeCompare(b.name,'id'));
  if(assetSearch) assets=assets.filter(a=>a.name.toLowerCase().includes(assetSearch));
  if(assetCatFilter) assets=assets.filter(a=>a.category===assetCatFilter);

  if(!assets.length){
    const emp=document.createElement('div');
    emp.className='asset-empty';
    emp.textContent=db.assets.length?'Tidak ada aset yang cocok.':'Belum ada aset.';
    wrap.appendChild(emp);
    return;
  }

  const table=document.createElement('table');
  table.className='asset-table';
  table.innerHTML=`<thead><tr>
    <th>#</th><th>Nama Aset</th><th>Kategori</th><th>Jml</th><th>Satuan</th><th>URL</th><th>Tgl Pengadaan</th><th>Keterangan</th>
    ${role==='admin'?'<th></th>':''}
  </tr></thead>`;
  const tbody=document.createElement('tbody');
  assets.forEach((a,i)=>{
    const tgl=a.acquiredAt?new Date(a.acquiredAt).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'—';
    const urlCell=a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:.72rem;white-space:nowrap;max-width:160px;display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:middle" title="${esc(a.url)}">${esc(a.url)}</a><button data-copy-url="${esc(a.url)}" style="margin-left:4px;background:none;border:none;cursor:pointer;color:var(--dim);font-size:.7rem;padding:0 2px;vertical-align:middle" title="Salin URL">⧉</button>`:'—';
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td style="color:var(--dim);font-size:.68rem">${i+1}</td>
      <td style="font-weight:600">${esc(a.name)}</td>
      <td>${esc(a.category||'—')}</td>
      <td style="font-family:var(--mono)">${a.qty??'—'}</td>
      <td>${esc(a.unit||'—')}</td>
      <td style="max-width:180px">${urlCell}</td>
      <td style="font-size:.72rem;white-space:nowrap">${tgl}</td>
      <td style="color:var(--muted);font-size:.72rem;white-space:pre-wrap">${esc(a.notes||'—')}</td>
      ${role==='admin'?`<td style="white-space:nowrap">
        <button class="asset-act-btn" data-asset-edit="${a.id}" title="Edit">✎</button>
        <button class="asset-act-btn del" data-asset-del="${a.id}" title="Hapus">✕</button>
      </td>`:''}
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  wrap.querySelectorAll('[data-asset-edit]').forEach(b=>b.addEventListener('click',()=>openModal('asset-edit',{id:b.dataset.assetEdit})));
  wrap.querySelectorAll('[data-asset-del]').forEach(b=>b.addEventListener('click',()=>{
    const a=db.assets.find(x=>x.id===b.dataset.assetDel);
    if(!a||!confirm(`Hapus aset "${a.name}"?`)) return;
    touch(Object.assign(a,{deleted:true}));
    save(); renderAssetTable();
  }));
  wrap.querySelectorAll('[data-copy-url]').forEach(b=>b.addEventListener('click',()=>{
    const text=(b.dataset.copyUrl||'').replace(/[​‌‍⁠﻿]/g,'');
    navigator.clipboard.writeText(text).then(()=>{
      const orig=b.textContent; b.textContent='✓'; setTimeout(()=>b.textContent=orig,1200);
    });
  }));
}
