function renderOrgChart(){
  const area=document.getElementById('orgArea');
  area.innerHTML='';

  if(!db.kelompoks.filter(k=>!k.deleted).length){
    area.innerHTML=`<div style="text-align:center;color:var(--dim);font-size:.78rem;padding:40px">Belum ada kelompok.</div>`;
    return;
  }

  const NW=148,NH=54,RH=40,HG=24,VG=56,PAD=24;

  /* subtree width = max(node width, sum of children subtrees + gaps) */
  function sw(id){
    const kids=kelompokChildren(id);
    if(!kids.length) return NW;
    const total=kids.reduce((s,k)=>s+sw(k.id),0)+(kids.length-1)*HG;
    return Math.max(NW,total);
  }

  /* assign absolute X center per node */
  const posX={};
  function assignX(kids,startX){
    let cur=startX;
    kids.forEach(k=>{
      const s=sw(k.id);
      posX[k.id]=cur+s/2;
      assignX(kelompokChildren(k.id),cur);
      cur+=s+HG;
    });
  }
  const topKids=kelompokChildren(null);
  const totalW=topKids.reduce((s,k)=>s+sw(k.id),0)+(topKids.length-1)*HG;
  assignX(topKids,PAD);

  /* depth per node */
  function nodeDepth(id){ const k=db.kelompoks.find(x=>x.id===id); return(!k||!k.parentId)?0:1+nodeDepth(k.parentId); }
  function maxD(id,d){ const kids=kelompokChildren(id); return kids.length?Math.max(...kids.map(c=>maxD(c.id,d+1))):d; }
  const maxDepth=topKids.length?Math.max(...topKids.map(k=>maxD(k.id,0))):0;

  const canvasW=totalW+PAD*2;
  const canvasH=PAD+RH+VG+(maxDepth+1)*(NH+VG)+PAD;

  const canvas=document.createElement('div');
  canvas.style.cssText=`position:relative;width:${canvasW}px;height:${canvasH}px;margin:0 auto`;

  /* Root node */
  const rootEl=document.createElement('div');
  rootEl.className='org-root-node';
  rootEl.textContent=db.orgName||'Alteco';
  rootEl.style.cssText=`position:absolute;top:${PAD}px;left:50%;transform:translateX(-50%)`;
  canvas.appendChild(rootEl);

  /* Kelompok nodes — absolutely positioned */
  db.kelompoks.filter(k=>!k.deleted).forEach(k=>{
    if(posX[k.id]===undefined) return;
    const d=nodeDepth(k.id);
    const y=PAD+RH+VG+d*(NH+VG);
    const isJoinable=k.joinable!==false;
    const mc=isJoinable?db.members.filter(m=>m.kelompokId===k.id&&!m.deleted).length:(k.jumlah??0);
    const tc=isJoinable?db.tasks.filter(t=>!t.deleted&&db.members.some(m=>m.id===t.memberId&&m.kelompokId===k.id&&!m.deleted)).length:0;
    const el=document.createElement('div');
    el.className='org-kelompok-node'+(k.parentId?' depth-1':'');
    el.dataset.kid=k.id;
    el.style.cssText=`position:absolute;left:${posX[k.id]-NW/2}px;top:${y}px;width:${NW}px`;
    el.innerHTML=`<div class="org-k-name">${esc(k.name)}</div><div class="org-k-meta">${mc} anggota${tc?` · ${tc} tugas`:''}</div>`;
    if(isJoinable) el.addEventListener('click',()=>openModal('kelompok-members',{kelompokId:k.id}));
    else el.style.cursor='default';
    canvas.appendChild(el);
  });

  area.appendChild(canvas);

  /* SVG connector lines after DOM is painted */
  requestAnimationFrame(()=>{
    const bdColor=getComputedStyle(document.documentElement).getPropertyValue('--bd').trim()||'#888';
    const cr=canvas.getBoundingClientRect();
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible';

    function getEl(id){ return canvas.querySelector(`[data-kid="${id}"]`); }
    function cxEl(el){ const r=el.getBoundingClientRect(); return Math.round(r.left+r.width/2-cr.left); }
    function botEl(el){ return Math.round(el.getBoundingClientRect().bottom-cr.top); }
    function topEl(el){ return Math.round(el.getBoundingClientRect().top-cr.top); }

    function seg(x1,y1,x2,y2){
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
      l.setAttribute('stroke',bdColor);l.setAttribute('stroke-width','1.5');l.setAttribute('stroke-linecap','round');
      svg.appendChild(l);
    }

    function branch(pCX,pBot,childEls){
      if(!childEls.length) return;
      const cTop=topEl(childEls[0]);
      const midY=Math.round((pBot+cTop)/2);
      seg(pCX,pBot,pCX,midY);
      const xs=childEls.map(cxEl);
      if(childEls.length===1){
        seg(xs[0],midY,xs[0],cTop);
      } else {
        seg(xs[0],midY,xs[xs.length-1],midY);
        xs.forEach((x,i)=>seg(x,midY,x,topEl(childEls[i])));
      }
    }

    /* root → top-level */
    const rootRect=rootEl.getBoundingClientRect();
    const rCX=Math.round(rootRect.left+rootRect.width/2-cr.left);
    const rBot=Math.round(rootRect.bottom-cr.top);
    branch(rCX,rBot,topKids.map(k=>getEl(k.id)).filter(Boolean));

    /* each kelompok → its children */
    db.kelompoks.filter(k=>!k.deleted).forEach(k=>{
      const el=getEl(k.id);
      if(!el) return;
      const childEls=kelompokChildren(k.id).map(c=>getEl(c.id)).filter(Boolean);
      if(childEls.length) branch(cxEl(el),botEl(el),childEls);
    });

    canvas.insertBefore(svg,canvas.firstChild);
  });
}

/* ── Dropdown jenis lomba (modal Tambah/Edit Lomba) ── */
function setupJenisPicker(lomba){
  const wrap=document.getElementById('fi-jenis-wrap');
  if(!wrap) return;
  const masters=(db.jenisLomba||[]).filter(j=>!j.deleted&&j.name);
  const cur=lomba?.jenis||null;
  const curMaster=(cur&&masters.some(m=>m.id===lomba?.jenisId))?null:cur;

  const opts=[`<option value="">— Tanpa Jenis —</option>`];
  if(curMaster) opts.push(`<option value="__current__">Jenis saat ini: ${esc(curMaster)}</option>`);
  masters.forEach(m=>opts.push(`<option value="${m.id}">${esc(m.name)}</option>`));

  wrap.innerHTML=`
    <select class="form-select" id="fi-lomba-jenis"${masters.length?'':' disabled'}>${opts.join('')}</select>
    ${masters.length?'':`<div class="tim-hint">Belum ada jenis. Buat dulu lewat tombol "🏷 Kelola Jenis" di toolbar.</div>`}`;

  const sel=document.getElementById('fi-lomba-jenis');
  if(curMaster) sel.value='__current__';
  else if(cur) sel.value=lomba.jenisId;
}

/* ── Daftar jenis master (modal "Kelola Jenis") ── */
function renderJenisList(){
  const box=document.getElementById('jn-list');
  if(!box) return;
  const list=(db.jenisLomba||[]).filter(j=>!j.deleted&&j.name);
  if(!list.length){
    box.innerHTML=`<div style="padding:22px;text-align:center;color:var(--dim);font-size:.76rem">Belum ada jenis.</div>`;
    return;
  }
  box.innerHTML=list.map(j=>{
    const used=(db.lombas||[]).filter(l=>!l.deleted&&l.jenis===j.name).length;
    return `
    <div class="ti-row">
      <div class="ti-info">
        <div class="ti-name">🏷 ${esc(j.name)}</div>
        <div class="ti-meta">${used?`${used} lomba`:'belum dipakai'}</div>
      </div>
      <div class="ti-acts">
        <button class="asset-act-btn" data-jn-edit="${j.id}" title="Edit jenis">✎</button>
        <button class="asset-act-btn del" data-jn-del="${j.id}" title="Hapus jenis">✕</button>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-jn-edit]').forEach(b=>b.addEventListener('click',()=>openModal('jenis-edit',{id:b.dataset.jnEdit})));
  box.querySelectorAll('[data-jn-del]').forEach(b=>b.addEventListener('click',()=>{
    const j=(db.jenisLomba||[]).find(x=>x.id===b.dataset.jnDel);
    if(!j) return;
    const used=(db.lombas||[]).filter(l=>!l.deleted&&l.jenis===j.name).length;
    const msg=used
      ? `Hapus jenis "${j.name}"?\n\n${used} lomba memakai jenis ini. Nama jenis di lomba tersebut tetap tersimpan.`
      : `Hapus jenis "${j.name}"?`;
    if(!confirm(msg)) return;
    touch(Object.assign(j,{deleted:true}));
    save(); renderLomba(); renderJenisList();
  }));
}


/* ══════════════════════════════════════════
   PEMILIH TIM & ANGGOTA TIM
   Setiap lomba punya salinan tim sendiri → ubah di satu lomba
   tidak memengaruhi lomba lain.
   ══════════════════════════════════════════ */
function cloneTimMembers(members){
  return (members||[]).map(m=>({
    id:uid(),
    name:m.name||'',
    peran:m.peran==='ketua'?'ketua':'anggota',
    nim:m.nim||''
  }));
}

function setupTimPicker(lomba){
  const wrap=document.getElementById('fi-tim-wrap');
  if(!wrap) return;
  const cur=lomba?normTim(lomba.tim):null;
  timPick=cur
    ? {mode:'current',name:cur.name,members:cloneTimMembers(cur.members),orig:cur}
    : {mode:'none',name:'',members:[],orig:null};

  const masters=(db.timLomba||[]).filter(t=>!t.deleted&&t.name);
  const opts=[
    `<option value="">— Tanpa Tim —</option>`,
    cur?`<option value="__current__">Tim saat ini: ${esc(cur.name)}</option>`:''
  ];
  if(masters.length){
    opts.push(`<optgroup label="Daftar Tim">`);
    masters.forEach(t=>opts.push(`<option value="master:${t.id}">${esc(t.name)}</option>`));
    opts.push(`</optgroup>`);
  }

  wrap.innerHTML=`
    <select class="form-select" id="fi-lomba-tim">${opts.join('')}</select>
    ${masters.length?'':`<div class="tim-hint">Belum ada tim. Buat dulu lewat tombol "👥 Kelola Tim" di toolbar.</div>`}
    <div id="fi-tim-editor" style="display:none">
      <input class="form-input" id="fi-tim-name" type="text" placeholder="Nama tim" maxlength="100" style="margin-top:8px"/>
      <table class="tim-table">
        <colgroup><col style="width:40%"/><col style="width:24%"/><col style="width:24%"/><col style="width:12%"/></colgroup>
        <thead><tr><th>Nama Anggota</th><th>Peran</th><th>NIM / ID</th><th></th></tr></thead>
        <tbody id="fi-tim-rows"></tbody>
      </table>
      <button type="button" class="tim-add-row" id="fi-tim-add">＋ Tambah Baris</button>
      <div class="tim-hint" id="fi-tim-hint"></div>
    </div>`;

  const sel=document.getElementById('fi-lomba-tim');
  sel.value=cur?'__current__':'';
  sel.addEventListener('change',e=>onTimSelect(e.target.value));

  document.getElementById('fi-tim-name').addEventListener('input',e=>{ if(timPick) timPick.name=e.target.value; });
  document.getElementById('fi-tim-add').addEventListener('click',()=>{
    if(!timPick) return;
    timPick.members.push({id:uid(),name:'',peran:'anggota',nim:''});
    renderTimRows();
    const inputs=document.querySelectorAll('#fi-tim-rows input[data-f="name"]');
    const last=inputs[inputs.length-1];
    if(last) last.focus();
  });

  onTimSelect(sel.value);
}

function onTimSelect(val){
  const ed=document.getElementById('fi-tim-editor');
  if(!ed||!timPick) return;
  if(val===''){
    timPick.mode='none';
    ed.style.display='none';
    return;
  }
  if(val==='__current__'){
    const o=timPick.orig||{name:'',members:[]};
    timPick.mode='current';
    timPick.name=o.name;
    timPick.members=cloneTimMembers(o.members);
  } else if(val.startsWith('master:')){
    const t=(db.timLomba||[]).find(x=>x.id===val.slice(7));
    timPick.mode='master';
    timPick.name=t?t.name:'';
    timPick.members=t?cloneTimMembers(timMembers(t)):[];
  }
  ed.style.display='';
  const nameInp=document.getElementById('fi-tim-name');
  if(nameInp) nameInp.value=timPick.name;
  renderTimRows();
}

function renderTimRows(){
  const tb=document.getElementById('fi-tim-rows');
  const hint=document.getElementById('fi-tim-hint');
  if(!tb||!timPick) return;

  if(!timPick.members.length){
    tb.innerHTML=`<tr><td colspan="4" style="padding:12px;text-align:center;color:var(--dim);font-size:.7rem">Belum ada anggota — tekan "＋ Tambah Baris".</td></tr>`;
  } else {
    tb.innerHTML=timPick.members.map((m,i)=>`
      <tr>
        <td><input class="form-input" data-f="name" data-i="${i}" type="text" value="${esc(m.name)}" placeholder="Nama lengkap" maxlength="60"/></td>
        <td><select class="form-select" data-f="peran" data-i="${i}">
          <option value="anggota"${m.peran!=='ketua'?' selected':''}>Anggota</option>
          <option value="ketua"${m.peran==='ketua'?' selected':''}>Ketua</option>
        </select></td>
        <td><input class="form-input" data-f="nim" data-i="${i}" type="text" value="${esc(m.nim)}" placeholder="Opsional" maxlength="30"/></td>
        <td style="text-align:center"><button type="button" class="tim-del-btn" data-del="${i}" title="Hapus anggota">✕</button></td>
      </tr>`).join('');
  }

  const bits=[];
  if(timPick.mode==='master') bits.push('Anggota disalin dari daftar tim — perubahan di sini tidak mengubah tim master.');
  if(timPick.mode==='current') bits.push('Ini salinan tim untuk lomba ini — perubahan di sini tidak mengubah tim master.');
  if((timPick.mode==='current'||timPick.mode==='master')&&!timPick.members.length) bits.push('Tim ini belum punya daftar anggota — tambahkan baris di bawah.');
  bits.push('Satu tim hanya boleh 1 ketua — anggota lain otomatis jadi Anggota.');
  if(hint) hint.textContent=bits.join(' ');

  tb.querySelectorAll('[data-f]').forEach(inp=>{
    const i=+inp.dataset.i;
    if(inp.tagName==='SELECT'){
      inp.addEventListener('change',e=>{
        const v=e.target.value;
        if(!timPick||!timPick.members[i]) return;
        timPick.members[i].peran=v;
        if(v==='ketua'){
          let demoted=0;
          timPick.members.forEach((m,j)=>{ if(j!==i&&m.peran==='ketua'){m.peran='anggota';demoted++;} });
          renderTimRows();
          if(demoted) alert('Peran anggota lain otomatis jadi Anggota.');
        }
      });
    } else {
      inp.addEventListener('input',e=>{
        if(!timPick||!timPick.members[i]) return;
        timPick.members[i][inp.dataset.f]=e.target.value;
      });
    }
  });

  tb.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(!timPick) return;
      timPick.members.splice(+b.dataset.del,1);
      renderTimRows();
    });
  });
}

function buildTimValue(){
  if(!timPick||timPick.mode==='none') return null;
  const nm=(timPick.name||'').trim();
  if(!nm){ alert('Nama tim wajib diisi.'); return false; }
  const mem=timPick.members.filter(m=>(m.name||'').trim());
  if(!mem.length){ alert('Isi minimal 1 anggota tim.'); return false; }
  return {
    name:nm,
    members:mem.map(m=>({
      id:m.id||uid(),
      name:m.name.trim(),
      peran:m.peran==='ketua'?'ketua':'anggota',
      nim:(m.nim||'').trim()
    }))
  };
}

/* ── Daftar tim master (modal "Kelola Tim") ── */
function renderTimList(){
  const box=document.getElementById('ti-list');
  if(!box) return;
  const list=(db.timLomba||[]).filter(t=>!t.deleted&&t.name);
  if(!list.length){
    box.innerHTML=`<div style="padding:22px;text-align:center;color:var(--dim);font-size:.76rem">Belum ada tim. Tekan "＋ Tambah Tim" untuk membuat tim pertama.</div>`;
    return;
  }
  box.innerHTML=list.map(t=>`
    <div class="ti-row">
      <div class="ti-info">
        <div class="ti-name">👥 ${esc(t.name)}</div>
        <div class="ti-meta">${timMembers(t).length} anggota</div>
      </div>
      <div class="ti-acts">
        <button class="asset-act-btn" data-ti-edit="${t.id}" title="Edit tim">✎</button>
        <button class="asset-act-btn del" data-ti-del="${t.id}" title="Hapus tim">✕</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('[data-ti-edit]').forEach(b=>b.addEventListener('click',()=>openModal('tim-edit',{id:b.dataset.tiEdit})));
  box.querySelectorAll('[data-ti-del]').forEach(b=>b.addEventListener('click',()=>{
    const t=(db.timLomba||[]).find(x=>x.id===b.dataset.tiDel);
    if(!t) return;
    const used=(db.lombas||[]).filter(l=>!l.deleted&&l.tim&&l.tim.name===t.name).length;
    const msg=used
      ? `Hapus tim "${t.name}"?\n\n${used} lomba memakai tim ini. Tim di lomba tersebut tetap tersimpan (lomba menyimpan salinan).`
      : `Hapus tim "${t.name}"?`;
    if(!confirm(msg)) return;
    touch(Object.assign(t,{deleted:true}));
    save(); renderLomba(); renderTimList();
  }));
}

function closeModal(){
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modalCancel').textContent='Batal';
  mMode=null; mCtx=null; timPick=null;
}

});

   INFO (EVENTS) VIEW
══════════════════════════════════════════ */
function renderInfo(){
  const area = document.getElementById('infoArea');
  area.innerHTML = '';
  const today = new Date().toISOString().slice(0,10);

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'asset-toolbar';
  toolbar.innerHTML = `<span class="asset-toolbar-title">Pemberitahuan</span>
    <input class="asset-search" id="infoSearchInp" placeholder="Cari pemberitahuan…" value="${esc(infoSearch)}" style="max-width:220px"/>`;
  if(role === 'admin'){
    const btn = document.createElement('button');
    btn.className = 'task-add-inline-btn';
    btn.textContent = '＋ Tambah';
    btn.addEventListener('click', ()=>openModal('event-add', {}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  area.querySelector('#infoSearchInp').addEventListener('input', e=>{
    infoSearch = e.target.value;
    renderInfoList(area, today);
  });

  renderInfoList(area, today);
}

function renderInfoList(area, today){
  // Remove old list sections
  area.querySelectorAll('.info-section').forEach(el=>el.remove());

  const q = infoSearch.toLowerCase();
  const all = (db.events||[]).filter(ev=> !ev.deleted && (!q || ev.title.toLowerCase().includes(q)));

  // Split: lampau = once && date < today; aktif = rest
  const aktif = all.filter(ev=> ev.type==='recurring' || !ev.date || ev.date >= today)
    .sort((a,b)=>{
      const da = a.date||'9999', db2 = b.date||'9999';
      return da.localeCompare(db2);
    });
  const lampau = all.filter(ev=> ev.type==='once' && ev.date && ev.date < today)
    .sort((a,b)=> a.date.localeCompare(b.date)); // ascending by date

  if(!all.length){
    const e = document.createElement('div');
    e.className = 'asset-empty info-section';
    e.textContent = infoSearch ? 'Tidak ditemukan.' : 'Belum ada pemberitahuan.';
    area.appendChild(e);
    return;
  }

  function buildCard(ev){
    const card = document.createElement('div');
    card.className = 'info-event-card';

    let badgeClass = 'info-recur', badgeText = '🔁 Berulang';
    let metaDate = '';
    if(ev.type === 'once'){
      if(!ev.date){ badgeClass='info-recur'; badgeText='—'; }
      else if(ev.date === today){ badgeClass='info-today'; badgeText='📌 Hari ini'; }
      else if(ev.date > today){
        const diff = Math.round((new Date(ev.date)-new Date(today))/86400000);
        badgeClass='info-soon'; badgeText=`📅 ${diff} hari lagi`;
      } else { badgeClass='info-past'; badgeText='✓ Selesai'; }
      if(ev.date) metaDate = new Date(ev.date+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});
    } else {
      badgeText = `🔁 ${recurrenceLabel(ev.recurrence||'mingguan')}`;
    }

    card.innerHTML = `
      <div class="info-event-title">${esc(ev.title)}</div>
      <div class="info-event-meta">
        <span class="info-event-badge ${badgeClass}">${badgeText}</span>
        ${metaDate?`<span>${metaDate}</span>`:''}
      </div>
      ${ev.desc?`<div style="font-size:.78rem;color:var(--muted);margin-top:6px;white-space:pre-wrap;line-height:1.55">${esc(ev.desc)}</div>`:''}
    `;
    if(role === 'admin'){
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:6px;margin-top:8px';
      actions.innerHTML = `
        <button class="asset-act-btn" data-ev-edit="${ev.id}">✎</button>
        <button class="asset-act-btn del" data-ev-del="${ev.id}">✕</button>
      `;
      card.appendChild(actions);
    }
    return card;
  }

  function buildSection(label, items){
    if(!items.length) return;
    const sec = document.createElement('div');
    sec.className = 'info-section';
    const hdr = document.createElement('div');
    hdr.style.cssText = 'padding:10px 16px 4px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em';
    hdr.textContent = label;
    sec.appendChild(hdr);
    items.forEach(ev=> sec.appendChild(buildCard(ev)));
    area.appendChild(sec);
  }

  buildSection('Aktif / Akan Datang', aktif);
  buildSection('Lampau', lampau);

  area.querySelectorAll('[data-ev-edit]').forEach(b=>b.addEventListener('click',()=>openModal('event-edit',{id:b.dataset.evEdit})));
  area.querySelectorAll('[data-ev-del]').forEach(b=>b.addEventListener('click',()=>{
    const ev = db.events.find(x=>x.id===b.dataset.evDel);
    if(!ev||!confirm(`Hapus pemberitahuan "${ev.title}"?`)) return;
    touch(Object.assign(ev,{deleted:true}));
    save(); renderInfo();
  }));
}

/* ══════════════════════════════════════════
   PROJECT VIEW
══════════════════════════════════════════ */
function fmtDate(d){ return d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):''; }

function computeProjectDates(proj){
  const activeMembers=(proj.members||[]).filter(m=>!m.deleted);
  const allOpt=activeMembers.flatMap(m=>(m.tasks||[]).filter(t=>!t.deleted&&t.dueDate).map(t=>t.dueDate));
  const allPess=activeMembers.flatMap(m=>(m.tasks||[]).filter(t=>!t.deleted).map(t=>t.datePessimistic||t.dueDate).filter(Boolean));
  if(!allOpt.length&&!allPess.length) return {optimistic:null,pessimistic:null};
  const pessimistic=allPess.length?allPess.reduce((a,b)=>a>b?a:b):null;
  const perMember=activeMembers.map(m=>{
    const dues=(m.tasks||[]).filter(t=>!t.deleted&&t.dueDate).map(t=>t.dueDate);
    return dues.length?dues.reduce((a,b)=>a>b?a:b):null;
  }).filter(Boolean);
  const optimistic=perMember.length?perMember.reduce((a,b)=>a<b?a:b):(pessimistic||null);
  return {optimistic,pessimistic:pessimistic||optimistic};
}

function projectStatus(proj){
  const today=new Date().toISOString().slice(0,10);
  const {pessimistic}=computeProjectDates(proj);
  if(!pessimistic) return 'active';
  if(today>pessimistic) return 'late';
  return 'active';
}

function projectProgress(proj){
  const tasks=(proj.members||[]).filter(m=>!m.deleted).flatMap(m=>(m.tasks||[]).filter(t=>!t.deleted));
  if(!tasks.length) return 0;
  return Math.round(tasks.filter(t=>t.done).length/tasks.length*100);
}

function timelinePercent(projStart,projEnd,date){
  if(!projStart||!projEnd||!date) return 0;
  const s=new Date(projStart).getTime(), e=new Date(projEnd).getTime(), d=new Date(date).getTime();
  if(e<=s) return 100;
  return Math.min(100,Math.max(0,Math.round((d-s)/(e-s)*100)));
}

function buildMemberRow(proj, mem, pEnd, canEditTask, canEditMember){
  const memRow=document.createElement('div');
  memRow.className='proj-member-row';
  const memTasks=(mem.tasks||[]).filter(t=>!t.deleted);
  const memDone=memTasks.filter(t=>t.done).length;

  const taskStarts=memTasks.filter(t=>t.startDate).map(t=>t.startDate);
  const taskEnds=memTasks.map(t=>t.datePessimistic||t.dueDate).filter(Boolean);
  const mStart=taskStarts.length?taskStarts.reduce((a,b)=>a<b?a:b):proj.startDate;
  const mEnd=taskEnds.length?taskEnds.reduce((a,b)=>a>b?a:b):pEnd;
  const mLeft=timelinePercent(proj.startDate,pEnd,mStart);
  const mWidth=Math.max(2,timelinePercent(proj.startDate,pEnd,mEnd)-mLeft);

  const _dbMem=mem.type==='internal'?db.members.find(x=>x.id===mem.internalMemberId):null;
  const memFullName=_dbMem?.fullName||null;
  const memAngkatan=_dbMem?.angkatan||null;
  memRow.innerHTML=`
    <div class="proj-member-head">
      <div class="proj-member-avatar">${initials(mem.name)}</div>
      <div style="flex:1">
        <div class="proj-member-name">${esc(mem.name)}${(memFullName||memAngkatan)?`<span class="fn-info-btn" title="Lihat info lengkap">ⓘ</span>`:''}</div>
        <div class="proj-member-role">${esc(mem.role||'')}${mem.type==='external'?' · Eksternal':''}</div>
      </div>
      <div style="font-size:.62rem;color:var(--dim)">${memDone}/${memTasks.length} tugas</div>
      ${canEditMember?`<div style="display:flex;gap:4px;margin-left:8px">
        <button class="asset-act-btn" data-mem-edit="${mem.id}" data-proj="${proj.id}">✎</button>
        <button class="asset-act-btn del" data-mem-del="${mem.id}" data-proj="${proj.id}">✕</button>
      </div>`:''}
    </div>
    ${proj.startDate&&pEnd?`<div class="proj-member-tl">
      <div class="proj-member-tl-bar" style="left:${mLeft}%;width:${Math.max(4,mWidth)}%"></div>
    </div>`:''}
    <div class="proj-task-list" id="tasklist-${proj.id}-${mem.id}"></div>
    ${canEditTask?`<button class="proj-add-btn" data-task-add="${mem.id}" data-proj="${proj.id}">＋ Tambah tugas</button>`:''}
  `;

  if(memFullName||memAngkatan){
    memRow.querySelector('.fn-info-btn').addEventListener('click',e=>{
      e.stopPropagation();
      showFullNamePopup(e.currentTarget,memberPopupText(memFullName,memAngkatan));
    });
  }
  const taskList=memRow.querySelector(`#tasklist-${proj.id}-${mem.id}`);
  memTasks.forEach(task=>{
    const ti=document.createElement('div');
    ti.className='proj-task-item'+(task.done?' done':'');
    ti.innerHTML=`
      <div class="proj-task-cb${task.done?' checked':''}" data-task-toggle="${task.id}" data-proj="${proj.id}" data-mem="${mem.id}">${task.done?'✓':''}</div>
      <span class="proj-task-text">${esc(task.text)}</span>
      <span class="proj-task-due">${task.startDate?fmtDate(task.startDate)+' → ':''}${task.dueDate?`<span style="color:var(--green)">${fmtDate(task.dueDate)}</span>`:''}${task.datePessimistic?` <span style="color:var(--red)">→ ${fmtDate(task.datePessimistic)}</span>`:''}</span>
      ${canEditTask?`<div class="proj-task-acts">
        <button class="asset-act-btn" style="font-size:.58rem;padding:2px 5px" data-task-edit="${task.id}" data-proj="${proj.id}" data-mem="${mem.id}">✎</button>
        <button class="asset-act-btn del" style="font-size:.58rem;padding:2px 5px" data-task-del="${task.id}" data-proj="${proj.id}" data-mem="${mem.id}">✕</button>
      </div>`:''}
    `;
    taskList.appendChild(ti);
  });
  return memRow;
}

function renderProject(){
  const area=document.getElementById('projectArea');
  area.innerHTML='';

  const toolbar=document.createElement('div');
  toolbar.className='asset-toolbar';
  toolbar.style.flexWrap='wrap';
  toolbar.innerHTML=`<span class="asset-toolbar-title">Proyek</span>
    <input class="asset-search" id="projSearchInp" type="search" placeholder="Cari proyek…" value="${esc(projectSearch)}" style="max-width:220px"/>`;
  if(role==='admin'){
    const btn=document.createElement('button');
    btn.className='task-add-inline-btn';
    btn.textContent='＋ Tambah Proyek';
    btn.addEventListener('click',()=>openModal('proj-add',{}));
    toolbar.appendChild(btn);
  }
  area.appendChild(toolbar);
  const searchInp=area.querySelector('#projSearchInp');
  searchInp.addEventListener('input',e=>{projectSearch=e.target.value;renderProject();});
  if(projectSearch){searchInp.focus();searchInp.setSelectionRange(searchInp.value.length,searchInp.value.length);}

  /* Viewer session badge in toolbar */
  if(role!=='admin'&&projSession){
    const badge=document.createElement('span');
    badge.style.cssText='display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--dim)';
    badge.innerHTML=`<span>👤 <strong style="color:var(--text)">${esc(projSession.memberName)}</strong></span>`;
    const outBtn=document.createElement('button');
    outBtn.textContent='Keluar';
    outBtn.style.cssText='font-size:.68rem;padding:3px 10px;border-radius:5px;border:1px solid var(--bd);background:var(--card);color:var(--muted);cursor:pointer';
    outBtn.addEventListener('click',()=>{ projSession=null; saveProjSession(); renderProject(); });
    badge.appendChild(outBtn);
    toolbar.appendChild(badge);
  }

  const allProjects=(db.projects||[]).filter(p=>!p.deleted).slice().sort((a,b)=>(a.title||'').localeCompare(b.title||'','id'));
  const q=projectSearch.trim().toLowerCase();
  let filtered=q?allProjects.filter(p=>(p.title||'').toLowerCase().includes(q)||(p.clientName||'').toLowerCase().includes(q)):allProjects;
  /* Viewer: filter to only projects where session member appears */
  if(role!=='admin'&&projSession){
    const mn=projSession.memberName.toLowerCase();
    filtered=filtered.filter(p=>(p.members||[]).some(m=>!m.deleted&&m.name.toLowerCase()===mn));
  }
  if(!filtered.length){
    const e=document.createElement('div');
    e.className='asset-empty';
    e.textContent=q?'Tidak ada proyek yang cocok.':(role!=='admin'?'Kamu belum terdaftar di proyek manapun.':'Belum ada proyek.');
    area.appendChild(e); return;
  }

  /* Viewer: show global unlock gate if no session */
  if(role!=='admin'&&!projSession){
    const gate=document.createElement('div');
    gate.className='proj-card';
    gate.style.cssText='padding:20px;text-align:center';
    gate.innerHTML=`
      <div style="font-size:.85rem;font-weight:700;margin-bottom:4px">🔒 Akses Proyek</div>
      <div style="font-size:.72rem;color:var(--dim);margin-bottom:14px">Masukkan nama dan kode untuk melihat proyek kamu</div>
      <div style="display:flex;flex-direction:column;gap:8px;max-width:300px;margin:0 auto">
        <input class="form-input" id="projGateName" type="text" placeholder="Nama kamu (sesuai data anggota)" autocomplete="off"/>
        <div style="position:relative">
          <input class="form-input" id="projGateCode" type="password" placeholder="Kode akses" maxlength="40"
            style="padding-right:36px;width:100%;box-sizing:border-box;font-family:var(--mono)"/>
          <button id="projGateEye" tabindex="-1"
            style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.8rem;padding:2px">👁</button>
        </div>
        <button id="projGateBtn" style="padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:.82rem;font-weight:700">Masuk</button>
        <div id="projGateErr" style="font-size:.72rem;color:var(--red,#f87171);min-height:14px"></div>
      </div>
    `;
    area.appendChild(gate);
    const nameInp=gate.querySelector('#projGateName');
    const codeInp=gate.querySelector('#projGateCode');
    const eyeBtn=gate.querySelector('#projGateEye');
    const btn=gate.querySelector('#projGateBtn');
    const errEl=gate.querySelector('#projGateErr');
    eyeBtn.addEventListener('click',()=>{ codeInp.type=codeInp.type==='password'?'text':'password'; });
    function tryGlobal(){
      const name=nameInp.value.trim();
      const code=codeInp.value.trim();
      if(!name||!code){ errEl.textContent='Isi nama dan kode.'; return; }
      if(!db.settings.projectKode){ errEl.textContent='Kode belum diatur admin.'; return; }
      if(code!==db.settings.projectKode){
        errEl.textContent='Kode tidak sesuai.';
        codeInp.classList.add('error');
        setTimeout(()=>{codeInp.classList.remove('error');errEl.textContent=''},1800); return;
      }
      const hasProj=(db.projects||[]).filter(p=>!p.deleted).some(p=>
        (p.members||[]).some(m=>!m.deleted&&m.name.toLowerCase()===name.toLowerCase())
      );
      if(!hasProj){
        errEl.textContent='Nama tidak ditemukan di proyek manapun.';
        nameInp.classList.add('error');
        setTimeout(()=>{nameInp.classList.remove('error');errEl.textContent=''},1800); return;
      }
      projSession={memberName:name}; saveProjSession(); renderProject();
    }
    btn.addEventListener('click',tryGlobal);
    codeInp.addEventListener('keydown',e=>{if(e.key==='Enter')tryGlobal();});
    nameInp.addEventListener('keydown',e=>{if(e.key==='Enter')codeInp.focus();});
    nameInp.focus();
    return;
  }

  filtered.forEach(proj=>{
    const card=document.createElement('div');
    card.className='proj-card';
    const isExpanded=expandedProjects.has(proj.id);
    const {optimistic:pOpt, pessimistic:pPess}=computeProjectDates(proj);
    const pEnd=pPess||pOpt||proj.startDate;
    const optPct=timelinePercent(proj.startDate,pEnd,pOpt);
    const status=projectStatus(proj);
    const pct=projectProgress(proj);
    const badgeCls=status==='late'?'proj-badge-late':'proj-badge-active';
    const badgeTxt=status==='late'?'Terlambat':'Aktif';

    if(role==='admin'){
      /* ── Admin: full view ── */
      card.innerHTML=`
        <div class="proj-card-head" data-toggle-proj="${proj.id}">
          <span class="proj-chevron${isExpanded?' open':''}">▶</span>
          <div style="flex:1">
            <div class="proj-title">${esc(proj.title)}</div>
            <div class="proj-client">Klien: ${esc(proj.clientName||'—')}</div>
          </div>
          <span class="proj-badge ${badgeCls}">${badgeTxt}</span>
          <div class="proj-actions">
            <button class="asset-act-btn" data-proj-edit="${proj.id}">✎</button>
            <button class="asset-act-btn del" data-proj-del="${proj.id}">✕</button>
          </div>
        </div>
        <div class="proj-meta">
          ${proj.priority?`<span style="color:${proj.priority==='high'?'var(--red,#f87171)':proj.priority==='medium'?'#fbbf24':'var(--dim)'}">● ${proj.priority==='high'?'High':proj.priority==='medium'?'Medium':'Low'}</span>`:''}
          ${proj.koordinatorId?`<span>👤 ${esc(db.members.find(m=>m.id===proj.koordinatorId)?.name||'—')}</span>`:''}
          ${proj.startDate?`<span>Mulai: ${fmtDate(proj.startDate)}</span>`:''}
          ${pOpt?`<span>🎯 Optimis: ${fmtDate(pOpt)}</span>`:''}
          ${pPess&&pPess!==pOpt?`<span>⚠ Pesimis: ${fmtDate(pPess)}</span>`:''}
          <span>${(proj.members||[]).filter(m=>!m.deleted).length} anggota · ${pct}% selesai</span>
          ${proj.repoUrl?`<a href="${esc(proj.repoUrl)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:.72rem;text-decoration:none" onclick="event.stopPropagation()">🔗 Repo</a>`:''}
        </div>
        ${proj.startDate&&pEnd&&pEnd!==proj.startDate?`
        <div class="proj-timeline-wrap">
          <div class="proj-timeline-label">
            <span>${fmtDate(proj.startDate)}</span>
            <span>${fmtDate(pEnd)}</span>
          </div>
          <div class="proj-timeline-bar">
            <div class="proj-tl-optimistic" style="width:${optPct}%"></div>
            <div class="proj-tl-buffer" style="width:${100-optPct}%"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:.58rem;color:var(--dim);margin-top:2px">
            <span></span>
            ${pOpt?`<span>🎯 ${fmtDate(pOpt)}</span>`:''}
          </div>
        </div>`:''}
        <div class="proj-progress"><div class="proj-progress-bar" style="width:${pct}%"></div></div>
      `;
      const collapse=document.createElement('div');
      collapse.className='proj-collapse'+(isExpanded?' open':'');
      const memSec=document.createElement('div');
      memSec.className='proj-member-section';
      (proj.members||[]).filter(m=>!m.deleted).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','id')).forEach(mem=>memSec.appendChild(buildMemberRow(proj,mem,pEnd,true,true)));
      const addMemBtn=document.createElement('button');
      addMemBtn.className='proj-add-btn';
      addMemBtn.style.cssText='margin-left:0;margin-top:8px';
      addMemBtn.textContent='＋ Tambah Anggota';
      addMemBtn.dataset.addMem=proj.id;
      memSec.appendChild(addMemBtn);
      collapse.appendChild(memSec);
      card.appendChild(collapse);
      card.querySelector('[data-toggle-proj]').addEventListener('click',e=>{
        if(e.target.closest('.proj-actions')) return;
        if(expandedProjects.has(proj.id)) expandedProjects.delete(proj.id); else expandedProjects.add(proj.id);
        collapse.classList.toggle('open');
        card.querySelector('.proj-chevron').classList.toggle('open');
      });

    } else {
      /* ── Viewer: global session already verified, show member's card ── */
      const mn=projSession.memberName.toLowerCase();
      const mem=(proj.members||[]).find(m=>!m.deleted&&m.name.toLowerCase()===mn);
      card.innerHTML=`
        <div class="proj-card-head" data-toggle-proj="${proj.id}">
          <span class="proj-chevron${isExpanded?' open':''}">▶</span>
          <div style="flex:1">
            <div class="proj-title">${esc(proj.title)}</div>
            <div class="proj-client">Klien: ${esc(proj.clientName||'—')}</div>
          </div>
          <span class="proj-badge ${badgeCls}">${badgeTxt}</span>
        </div>
        <div class="proj-meta">
          ${proj.priority?`<span style="color:${proj.priority==='high'?'var(--red,#f87171)':proj.priority==='medium'?'#fbbf24':'var(--dim)'}">● ${proj.priority==='high'?'High':proj.priority==='medium'?'Medium':'Low'}</span>`:''}
          ${proj.koordinatorId?`<span>👤 ${esc(db.members.find(m=>m.id===proj.koordinatorId)?.name||'—')}</span>`:''}
          ${proj.startDate?`<span>Mulai: ${fmtDate(proj.startDate)}</span>`:''}
          ${pOpt?`<span>🎯 Optimis: ${fmtDate(pOpt)}</span>`:''}
          ${pPess&&pPess!==pOpt?`<span>⚠ Pesimis: ${fmtDate(pPess)}</span>`:''}
          <span>${(proj.members||[]).filter(m=>!m.deleted).length} anggota · ${pct}% selesai</span>
        </div>
        ${proj.startDate&&pEnd&&pEnd!==proj.startDate?`
        <div class="proj-timeline-wrap">
          <div class="proj-timeline-label">
            <span>${fmtDate(proj.startDate)}</span>
            <span>${fmtDate(pEnd)}</span>
          </div>
          <div class="proj-timeline-bar">
            <div class="proj-tl-optimistic" style="width:${optPct}%"></div>
            <div class="proj-tl-buffer" style="width:${100-optPct}%"></div>
          </div>
        </div>`:''}
        <div class="proj-progress"><div class="proj-progress-bar" style="width:${pct}%"></div></div>
      `;
      if(mem){
        const colV=document.createElement('div');
        colV.className='proj-collapse'+(isExpanded?' open':'');
        const memSec=document.createElement('div');
        memSec.className='proj-member-section';
        memSec.appendChild(buildMemberRow(proj,mem,pEnd,true,false));
        colV.appendChild(memSec);
        card.appendChild(colV);
        card.querySelector('[data-toggle-proj]').addEventListener('click',()=>{
          if(expandedProjects.has(proj.id)) expandedProjects.delete(proj.id); else expandedProjects.add(proj.id);
          colV.classList.toggle('open');
          card.querySelector('.proj-chevron').classList.toggle('open');
        });
      }
    }

    area.appendChild(card);
  });

  /* Event delegation for all dynamically rendered buttons */
  area.querySelectorAll('[data-proj-edit]').forEach(b=>b.addEventListener('click',()=>openModal('proj-edit',{id:b.dataset.projEdit})));
  area.querySelectorAll('[data-proj-del]').forEach(b=>b.addEventListener('click',()=>{
    const p=db.projects.find(x=>x.id===b.dataset.projDel);
    if(!p||!confirm(`Hapus proyek "${p.title}"?`)) return;
    touch(Object.assign(p,{deleted:true})); save(); renderProject();
  }));
  area.querySelectorAll('[data-task-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const proj=db.projects.find(x=>x.id===b.dataset.proj);
    const mem=proj?.members?.find(m=>m.id===b.dataset.mem);
    const task=mem?.tasks?.find(t=>t.id===b.dataset.taskToggle);
    if(!task) return;
    task.done=!task.done; touch(task); save(); renderProject();
  }));
  area.querySelectorAll('[data-task-add]').forEach(b=>b.addEventListener('click',()=>openModal('proj-task-add',{projId:b.dataset.proj,memberId:b.dataset.taskAdd})));
  area.querySelectorAll('[data-task-edit]').forEach(b=>b.addEventListener('click',()=>openModal('proj-task-edit',{projId:b.dataset.proj,memberId:b.dataset.mem,taskId:b.dataset.taskEdit})));
  area.querySelectorAll('[data-task-del]').forEach(b=>b.addEventListener('click',()=>{
    const proj=db.projects.find(x=>x.id===b.dataset.proj);
    const mem=proj?.members?.find(m=>m.id===b.dataset.mem);
    if(!mem||!confirm('Hapus tugas ini?')) return;
    const tDel=(mem.tasks||[]).find(t=>t.id===b.dataset.taskDel);
    if(tDel){touch(Object.assign(tDel,{deleted:true}));} save(); renderProject();
  }));
  area.querySelectorAll('[data-mem-edit]').forEach(b=>b.addEventListener('click',()=>openModal('proj-mem-edit',{projId:b.dataset.proj,memberId:b.dataset.memEdit})));
  area.querySelectorAll('[data-mem-del]').forEach(b=>b.addEventListener('click',()=>{
    const proj=db.projects.find(x=>x.id===b.dataset.proj);
    const mem=proj?.members?.find(m=>m.id===b.dataset.memDel);
    if(!mem||!confirm(`Hapus anggota "${mem.name}" dari proyek ini?`)) return;
    (mem.tasks||[]).forEach(t=>touch(Object.assign(t,{deleted:true})));
    touch(Object.assign(mem,{deleted:true})); save(); renderProject();
  }));
  area.querySelectorAll('[data-add-mem]').forEach(b=>b.addEventListener('click',()=>openModal('proj-mem-add',{projId:b.dataset.addMem})));
}

  toolbar.className = 'asset-toolbar';
  toolbar.innerHTML = `<span class="asset-toolbar-title">Pengaturan</span>`;

    <div class="settings-section-title">Notifikasi</div>
    <div class="settings-row">
      <div>
        <div class="settings-row-label">Push Notification</div>
        <div class="settings-row-desc">Notif muncul walau browser tutup (via OneSignal). Aktifkan hanya jika OneSignal sudah dikonfigurasi.</div>

      <div>
        <div class="settings-row-label">Notif Mulai H-</div>

      </div>
      <input type="number" id="notifDaysInp" min="0" max="30" value="${s.notifDaysBefore??1}" style="padding:5px 8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--text);font-size:.82rem;outline:none;width:70px;text-align:center"/>
    </div>
  `;

  const saveBtn = document.createElement('button');

    setTimeout(()=>ok.remove(), 2000);

  const cardBc = document.createElement('div');
  cardBc.className = 'settings-card';
  cardBc.innerHTML = `
    <div class="settings-section-title">Akses Broadcast</div>
    <div class="settings-row">
      <div style="flex:1">
        <div class="settings-row-label">Kode Broadcast Global</div>
        <div class="settings-row-desc">Satu kode untuk semua produk broadcast. Viewer masukkan kode ini untuk melihat kondisi &amp; broadcast. Kosongkan jika semua boleh akses.</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <div style="position:relative;flex:1;max-width:300px">
        <input class="form-input" id="fi-bc-global-kode" type="password" value="${esc(s.broadcastKode||'')}"

        <button id="bcKodeEye" tabindex="-1"

  const cardProj = document.createElement('div');
  cardProj.className = 'settings-card';
  cardProj.innerHTML = `
    <div class="settings-section-title">Akses Proyek</div>
    <div class="settings-row">
      <div style="flex:1">
        <div class="settings-row-label">Kode Proyek Global</div>
        <div class="settings-row-desc">Satu kode untuk semua proyek. Viewer masukkan nama + kode ini untuk mengakses proyek mereka.</div>

  /* ── Card 2: Kirim Manual ── */

  card2.appendChild(forceRow);
  area.appendChild(card2);
}

/* ══════════════════════════════════════════
   CULTURE VIEW
══════════════════════════════════════════ */
function renderCultures(){
  const area=document.getElementById('cultureArea');
  area.innerHTML='';

  const toolbar=document.createElement('div');
  toolbar.className='asset-toolbar';
  toolbar.style.cssText='';
  toolbar.innerHTML=`<span class="asset-toolbar-title">Sejarah Organisasi</span>`;
  area.appendChild(toolbar);

  const cultures=(db.cultures||[]).filter(c=>!c.deleted);
  if(!cultures.length){
    const e=document.createElement('div');
    e.className='asset-empty';
    e.textContent='Belum ada catatan sejarah organisasi.';
    area.appendChild(e); return;
  }

  /* Sort: has date → by date asc; no date → by createdAt asc. Newest at top = reverse. */
  const sorted=[...cultures].sort((a,b)=>{
    const ka=a.date||new Date(a.createdAt).toISOString().slice(0,10);
    const kb=b.date||new Date(b.createdAt).toISOString().slice(0,10);
    return ka<kb?-1:ka>kb?1:0;
  });

  const MONTH=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  function fmtDate(d){
    if(!d) return null;
    const [y,m,dd]=d.split('-');
    return `${parseInt(dd)} ${MONTH[parseInt(m)-1]} ${y}`;
  }

  const BADGE_LABEL={internal:'🏠 Internal',eksternal:'🌐 Eksternal',kolaborasi:'🤝 Kolaborasi'};

  const tl=document.createElement('div');
  tl.className='culture-timeline';

  /* Rendered bottom-to-top visually: oldest at bottom → render reversed in DOM, then CSS flex-col-reverse */
  tl.style.display='flex';
  tl.style.flexDirection='column-reverse';

  sorted.forEach((c,i)=>{
    const side=i%2===0?'tl-left':'tl-right';
    const item=document.createElement('div');
    item.className=`culture-timeline-item ${side}`;

    const dot=document.createElement('div');
    dot.className='culture-tl-dot';

    const card=document.createElement('div');
    card.className='culture-tl-card';

    const dateStr=fmtDate(c.date);
    const badgeHtml=c.type&&BADGE_LABEL[c.type]?`<div class="culture-tl-badge ${c.type}">${BADGE_LABEL[c.type]}</div>`:'';
    const descHtml=c.description?`<div class="culture-tl-desc">${esc(c.description)}</div>`:'';
    const actsHtml=role==='admin'?`<div class="culture-tl-acts">
      <button class="asset-act-btn" data-culture-edit="${c.id}">✎</button>
      <button class="asset-act-btn del" data-culture-del="${c.id}">✕</button>
    </div>`:'';

    card.innerHTML=`
      ${badgeHtml}
      ${dateStr?`<div class="culture-tl-date">${dateStr}</div>`:''}
      <div class="culture-tl-title">${esc(c.title)}</div>
      ${descHtml}
      ${actsHtml}
    `;
    card.querySelector('[data-culture-edit]')?.addEventListener('click',()=>openModal('culture-edit',{id:c.id}));
    card.querySelector('[data-culture-del]')?.addEventListener('click',()=>{
      if(!confirm(`Hapus "${c.title}"?`)) return;
      touch(Object.assign(c,{deleted:true})); save(); renderCultures();
    });

    item.appendChild(card);
    item.appendChild(dot);
    tl.appendChild(item);
  });

  area.appendChild(tl);
}

function renderKomunitas(){
  const area=document.getElementById('komunitasArea');
  area.innerHTML='';
  const km=db.regulasi;
  const isAdmin=role==='admin';

  const TIPE_CFG={
    it:{label:'IT',color:'#2563eb',bg:'#dbeafe'},

  const SANKSI_CFG={
    1:{label:'Warning 1',color:'#d97706',bg:'#fef3c7'},
    2:{label:'Warning 2',color:'#ea580c',bg:'#ffedd5'},
    3:{label:'Blacklist',color:'#dc2626',bg:'#fee2e2'},

  const toolbar=document.createElement('div');
  toolbar.className='asset-toolbar';
  toolbar.innerHTML=`<span class="asset-toolbar-title">Regulasi</span>`;
  area.appendChild(toolbar);

  /* ── Tab bar ── */

    {id:'vismis',label:'📜 Visi & Misi'},
    {id:'syarat-anggota',label:'👤 Syarat Anggota'},
    {id:'syarat-tim',label:'👥 Syarat Tim'},
    {id:'keuntungan',label:'🎁 Keuntungan'},
    {id:'sanksi',label:'⚠️ Sanksi'},

  const tabBar=document.createElement('div');
  tabBar.style.cssText='display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap';
  TABS.forEach(t=>{
    const btn=document.createElement('button');
    btn.dataset.tab=t.id;
    btn.textContent=t.label;
    btn.className='km-tab-btn'+(t.id===activeTab?' active':'');
    btn.addEventListener('click',()=>{ area._kmTab=t.id; renderKomunitas(); });
    tabBar.appendChild(btn);
  });
  area.appendChild(tabBar);

  const card=document.createElement('div');
  card.className='settings-card';
  card.style.cssText='overflow-y:auto;max-height:calc(100vh - 220px)';
  area.appendChild(card);

  /* ── Tab: Visi & Misi ── */
  if(activeTab==='vismis'){
    const vm_acts=isAdmin?`<button id="btnEditVismis" class="km-pill-btn" style="margin-left:auto">✎ Edit</button>`:'';
    card.innerHTML=`
      <div class="settings-section-title" style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
        Visi &amp; Misi ${vm_acts}
      </div>
      <div style="margin-bottom:18px">
        <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:6px">Visi</div>
        <div style="font-size:.9rem;line-height:1.7;white-space:pre-wrap;color:var(--text)">${km.visi?esc(km.visi):'<span style="color:var(--dim);font-style:italic">Belum diisi.</span>'}</div>
      </div>
      <div>
        <div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:6px">Misi</div>
        <div style="font-size:.9rem;line-height:1.7;white-space:pre-wrap;color:var(--text)">${km.misi?esc(km.misi):'<span style="color:var(--dim);font-style:italic">Belum diisi.</span>'}</div>
      </div>
    `;
    if(isAdmin) card.querySelector('#btnEditVismis').addEventListener('click',()=>openModal('vismis-edit',{}));
  }

  /* ── Tab: Syarat (shared renderer) ── */
  else if(activeTab==='syarat-anggota'||activeTab==='syarat-tim'){
    const listKey=activeTab==='syarat-tim'?'syaratTim':'syaratAnggota';
    const tabLabel=activeTab==='syarat-tim'?'Syarat Tim':'Syarat Anggota';
    const syHdr=document.createElement('div');
    syHdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px';
    syHdr.innerHTML=`<div class="settings-section-title" style="margin:0;padding-bottom:0;border:none">${tabLabel}</div>`;
    if(isAdmin){
      const addBtn=document.createElement('button');
      addBtn.className='task-add-inline-btn';
      addBtn.textContent='＋ Tambah';
      addBtn.addEventListener('click',()=>openModal('syarat-add',{listKey}));
      syHdr.appendChild(addBtn);
    }
    card.appendChild(syHdr);

    /* filter IT/Non-IT */
    const filterRow=document.createElement('div');
    filterRow.style.cssText='display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap';
    const _filterKey='_syFilter_'+listKey;
    ['non-it','it'].forEach(val=>{
      const fb=document.createElement('button');
      fb.dataset.syf=val;
      const active=card[_filterKey]===val||(card[_filterKey]==null&&val==='non-it');
      fb.textContent=val==='it'?'IT':'Non-IT';
      fb.className='km-pill-btn'+(active?' active':'');
      fb.addEventListener('click',()=>{ card[_filterKey]=val; renderSyContent(); refreshFilterBtns(); });
      filterRow.appendChild(fb);
    });
    card.appendChild(filterRow);

    function refreshFilterBtns(){
      filterRow.querySelectorAll('[data-syf]').forEach(b=>{
        const active=b.dataset.syf===(card[_filterKey]||'non-it');
        b.className='km-pill-btn'+(active?' active':'');
      });
    }

    const listWrap=document.createElement('div');
    card.appendChild(listWrap);

    function renderSyContent(){
      listWrap.innerHTML='';
      const filterVal=card[_filterKey]||'non-it';
      const allList=(km[listKey]||[]).filter(s=>!s.deleted);
      const syList=allList.filter(s=>s.tipe==='keduanya'||(filterVal==='it'?s.tipe==='it':s.tipe!=='it'));
      if(!syList.length){
        const e=document.createElement('div');
        e.style.cssText='color:var(--dim);font-style:italic;font-size:.82rem;padding:12px 0';
        e.textContent='Belum ada syarat untuk tipe ini.';
        listWrap.appendChild(e);
        return;
      }
      syList.forEach((s,idx)=>{
        const tCfg=TIPE_CFG[s.tipe]||TIPE_CFG['non-it'];
        const urlHtml=s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener" style="font-size:.75rem;color:var(--accent);word-break:break-all">${esc(s.url)}</a>`:'';
        const gIdx=allList.findIndex(x=>x.id===s.id);
        const upDisabled=gIdx<=0;
        const dnDisabled=gIdx>=allList.length-1;
        const reorderHtml=isAdmin?`
          <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;margin-top:1px">
            <button class="asset-act-btn" data-sy-up="${s.id}" ${upDisabled?'disabled':''} style="padding:1px 5px;font-size:.7rem;line-height:1.4${upDisabled?';opacity:.3':''}">▲</button>
            <button class="asset-act-btn" data-sy-dn="${s.id}" ${dnDisabled?'disabled':''} style="padding:1px 5px;font-size:.7rem;line-height:1.4${dnDisabled?';opacity:.3':''}">▼</button>
          </div>`:'';
        const actsHtml=isAdmin?`<div style="display:flex;gap:5px;margin-top:6px">
          <button class="asset-act-btn" data-sy-edit="${s.id}">✎</button>
          <button class="asset-act-btn del" data-sy-del="${s.id}">✕</button>
        </div>`:'';
        const row=document.createElement('div');
        row.className='settings-row';
        row.style.cssText='align-items:flex-start;gap:8px;padding:12px 0';
        row.innerHTML=`
          ${reorderHtml}
          <span style="min-width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">${idx+1}</span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <span style="font-weight:600;font-size:.9rem;color:var(--text)">${esc(s.nama)}</span>
              <span style="font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:99px;background:${tCfg.bg};color:${tCfg.color}">${tCfg.label}</span>
            </div>
            ${s.keterangan?`<div style="font-size:.82rem;color:var(--dim);margin-top:3px;line-height:1.5">${esc(s.keterangan)}</div>`:''}
            ${urlHtml}
            ${actsHtml}
          </div>
        `;
        row.querySelector('[data-sy-up]')?.addEventListener('click',()=>{
          const arr=db.regulasi[listKey];
          if(gIdx>0){[arr[gIdx-1],arr[gIdx]]=[arr[gIdx],arr[gIdx-1]];touch(arr[gIdx-1]);touch(arr[gIdx]);save();renderKomunitas();}
        });
        row.querySelector('[data-sy-dn]')?.addEventListener('click',()=>{
          const arr=db.regulasi[listKey];
          if(gIdx<arr.length-1){[arr[gIdx+1],arr[gIdx]]=[arr[gIdx],arr[gIdx+1]];touch(arr[gIdx+1]);touch(arr[gIdx]);save();renderKomunitas();}
        });
        row.querySelector('[data-sy-edit]')?.addEventListener('click',()=>openModal('syarat-edit',{id:s.id,listKey}));
        row.querySelector('[data-sy-del]')?.addEventListener('click',()=>{
          if(!confirm(`Hapus syarat "${s.nama}"?`)) return;
          const t=db.regulasi[listKey].find(x=>x.id===s.id);
          if(t) touch(Object.assign(t,{deleted:true}));
          save(); renderKomunitas();
        });
        listWrap.appendChild(row);
      });
    }
    renderSyContent();
  }

  /* ── Tab: Keuntungan ── */
  else if(activeTab==='keuntungan'){
    const ktHdr=document.createElement('div');
    ktHdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px';
    ktHdr.innerHTML=`<div class="settings-section-title" style="margin:0;padding-bottom:0;border:none">Keuntungan Bergabung</div>`;
    if(isAdmin){
      const addBtn=document.createElement('button');
      addBtn.className='task-add-inline-btn';
      addBtn.textContent='＋ Tambah';
      addBtn.addEventListener('click',()=>openModal('keuntungan-add',{}));
      ktHdr.appendChild(addBtn);
    }
    card.appendChild(ktHdr);

    /* filter kelompok */
    const kelList=(db.kelompoks||[]).filter(k=>!k.deleted);
    const filterRow=document.createElement('div');
    filterRow.style.cssText='display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap';
    const _fk='_ktFilter';
    const allOpt=document.createElement('button');
    allOpt.dataset.ktf='';

      const fb=document.createElement('button');
      fb.dataset.ktf=k.name;
      const active=card[_fk]===k.name;
      fb.textContent=k.name;

        const actsHtml=isAdmin?`<div style="display:flex;gap:5px;margin-top:6px">
          <button class="asset-act-btn" data-kt-edit="${s.id}">✎</button>
          <button class="asset-act-btn del" data-kt-del="${s.id}">✕</button>
        </div>`:'';
        const row=document.createElement('div');
        row.className='settings-row';
        row.style.cssText='align-items:flex-start;gap:8px;padding:12px 0';

          ${reorderHtml}

    } else {

        const actsHtml=isAdmin?`<div style="display:flex;gap:6px;flex-shrink:0">
